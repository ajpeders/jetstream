<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jetstream</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230b0f14"/><path d="M18 44V18l26 13-26 13z" fill="%2338bdf8"/></svg>'>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0a0a0a;
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.85rem 1.2rem;
    background: #111;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  header h1 { margin: 0; font-size: 1rem; font-weight: 500; }
  /* Small now-playing poster thumb — sits between the brand and the title
     text, only shown for FILE sources that resolved to an arr cover. */
  #now-thumb {
    flex-shrink: 0;
    width: 32px; height: 48px;
    background: #0a0a0a; border-radius: 3px; overflow: hidden;
    display: none;
  }
  #now-thumb.show { display: block; }
  #now-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #status {
    flex: 1;
    color: #888;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status .live {
    display: inline-block;
    background: #c00;
    color: white;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    margin-right: 0.5rem;
    letter-spacing: 0.05em;
  }
  #viewers { color: #888; font-size: 0.85rem; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
  }
  #player-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
  }
  video {
    display: block;
    width: 100%;
    /* Hold the box at 16:9 so pause / seek / auto-advance can't collapse the layout
       when the <video> momentarily has no intrinsic dimensions. Real video aspect
       gets letterboxed via object-fit. */
    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 50px);
    background: black;
    object-fit: contain;
  }
  /* Fullscreen overrides — the inline-mode max-height reserves space for the
     header, but in fullscreen there IS no header, and that ~50 px short-fall
     manifests as a weird letterboxed video that doesn't fill the screen on
     1440p/4K monitors. Drop the height cap and the aspect-ratio box so the
     element fills whatever fullscreen target it ended up on. Both
     `:fullscreen` (standard) and `:-webkit-full-screen` (iOS Safari + old
     WebKit) so the rule wins on every engine we care about. */
  #player-wrap:fullscreen,
  #player-wrap:-webkit-full-screen {
    width: 100vw; height: 100vh;
  }
  #player-wrap:fullscreen video,
  #player-wrap:-webkit-full-screen video,
  video:fullscreen,
  video:-webkit-full-screen {
    width: 100%; height: 100%;
    max-height: none;
    aspect-ratio: auto;
  }
  #unmute-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 1rem;
    letter-spacing: 0.02em;
    /* Behind the controls so the PiP / fullscreen / mute buttons stay
       clickable even while the "tap to unmute" overlay is showing. The
       overlay still catches taps on the empty area around the controls. */
    z-index: 1;
  }
  #unmute-overlay.hidden { display: none; }
  #vol-controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    /* Above the unmute-overlay so all four buttons stay tappable while
       the overlay is shown — without this, mobile-Safari users couldn't
       reach PiP/fullscreen until they unmuted. */
    z-index: 2;
    display: flex;
    gap: 0.4rem;
    background: rgba(0,0,0,0.55);
    padding: 0.3rem 0.5rem;
    border-radius: 4px;
    align-items: center;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  #vol-controls:hover { opacity: 1; }
  #vol-controls button {
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 0.95rem;
    /* Hit target sized for iOS HIG's 44pt minimum on touch — the previous
       ~20px tall buttons let near-misses fall through to the unmute overlay
       under the controls. Inline-flex centering keeps the glyph optically
       small while the touch box grows. */
    min-width: 44px; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.1rem 0.3rem;
  }
  #vol-controls input[type="range"] {
    width: 80px;
    accent-color: white;
  }
  .placeholder {
    color: #555;
    font-size: 0.95rem;
    padding: 3rem;
    text-align: center;
  }
  /* Read-only "up next" queue for viewers. Collapsible like chat. */
  #queue-panel {
    background: #0e0e0e;
    border-top: 1px solid #1f1f1f;
    max-height: 30vh; overflow-y: auto;
  }
  #queue-panel.collapsed { max-height: 2.4rem; overflow: hidden; }
  #queue-head {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem; cursor: pointer; user-select: none;
    position: sticky; top: 0; background: #0e0e0e;
    border-bottom: 1px solid #1a1a1a;
  }
  #queue-head h2 { margin: 0; font-size: 0.85rem; font-weight: 500; color: #ccc; letter-spacing: 0.02em; }
  #queue-count {
    flex: 1; color: #666; font-size: 0.78rem; font-variant-numeric: tabular-nums;
  }
  #queue-head .toggle { color: #666; font-size: 0.8rem; }
  #queue-panel.collapsed #queue-head { border-bottom: none; }
  #queue-list { list-style: none; margin: 0; padding: 0.3rem 0 0.5rem; }
  #queue-list li {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.3rem 1rem; font-size: 0.85rem; color: #ccc;
  }
  #queue-list .qpos { color: #555; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
  #queue-list .qthumb {
    flex-shrink: 0; width: 26px; height: 39px;
    background: #0e0e0e; border-radius: 3px; overflow: hidden;
  }
  #queue-list .qthumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.18s ease; }
  #queue-list .qthumb img.loaded { opacity: 1; }
  #queue-list .qtitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue-list .qdur { color: #777; font-size: 0.78rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  #queue-list .empty { color: #555; padding: 0.4rem 1rem; }
  /* "Request something" — same collapsible chrome as the up-next panel, but
     interactive: viewers search and tap "Request" to suggest media to the host. */
  #request-panel {
    background: #0e0e0e;
    border-top: 1px solid #1f1f1f;
    max-height: 32vh; overflow-y: auto;
  }
  #request-panel.collapsed { max-height: 2.4rem; overflow: hidden; }
  #request-head {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem; cursor: pointer; user-select: none;
    position: sticky; top: 0; background: #0e0e0e;
    border-bottom: 1px solid #1a1a1a;
  }
  #request-head h2 { margin: 0; font-size: 0.85rem; font-weight: 500; color: #ccc; letter-spacing: 0.02em; flex: 1; }
  #request-head .toggle { color: #666; font-size: 0.8rem; }
  #request-panel.collapsed #request-head { border-bottom: none; }
  #request-search {
    width: calc(100% - 2rem); margin: 0.5rem 1rem;
    background: #1a1a1a; color: #eee;
    border: 1px solid #2a2a2a; border-radius: 4px;
    padding: 0.4rem 0.6rem; font-size: 0.85rem; font-family: inherit;
  }
  #request-search:focus { outline: none; border-color: #444; }
  #request-results { list-style: none; margin: 0; padding: 0 0 0.5rem; }
  #request-results li {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.3rem 1rem; font-size: 0.85rem; color: #ccc;
  }
  #request-results .rthumb {
    flex-shrink: 0; width: 30px; height: 45px;
    background: #0e0e0e; border-radius: 3px; overflow: hidden;
  }
  #request-results .rthumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.18s ease; }
  #request-results .rthumb img.loaded { opacity: 1; }
  #request-results .rtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; overflow: hidden; }
  #request-results .rtitle .rt-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #request-results .rtitle .rt-parent { color: #666; font-size: 0.72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #request-results button {
    background: #2a2a2a; color: #eee; border: 1px solid #333;
    padding: 0.2rem 0.6rem; font-size: 0.78rem; border-radius: 4px;
    cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  #request-results button:hover { background: #333; }
  #request-results button:disabled { opacity: 0.5; cursor: default; }
  #request-results button.done { background: #1f3326; color: #7dcc99; border-color: #2c4a37; }
  #request-results .empty { color: #555; padding: 0.4rem 1rem; }
  /* Anonymous chat panel — collapsible. Sits below the player, takes the
     remaining viewport height up to 40vh. No usernames; each session gets a
     small color dot derived from a localStorage-stored opaque id. */
  #chat {
    background: #0e0e0e;
    border-top: 1px solid #1f1f1f;
    display: flex;
    flex-direction: column;
    max-height: 40vh;
    transition: max-height 0.15s;
  }
  #chat.collapsed { max-height: 2.4rem; overflow: hidden; }
  #chat-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-bottom: 1px solid #1a1a1a;
    user-select: none;
  }
  #chat-header h2 {
    margin: 0; font-size: 0.85rem; font-weight: 500; color: #ccc;
    letter-spacing: 0.02em; flex: 1;
  }
  #chat-header .toggle { color: #666; font-size: 0.8rem; }
  #chat.collapsed #chat-header { border-bottom: none; }
  #chat-messages {
    flex: 1; overflow-y: auto;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    /* Reserve a baseline so an empty panel still looks intentional. */
    min-height: 6rem;
  }
  #chat-messages .empty { color: #555; padding: 0.5rem 0; }
  .chat-msg { display: flex; gap: 0.5rem; padding: 0.18rem 0; align-items: flex-start; }
  .chat-dot {
    flex-shrink: 0;
    width: 0.55rem; height: 0.55rem;
    border-radius: 50%;
    margin-top: 0.45rem;
  }
  .chat-name { color: #aaa; font-weight: 600; flex-shrink: 0; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-msg.self .chat-name { color: #ddd; }
  .chat-text { flex: 1; color: #ddd; word-wrap: break-word; overflow-wrap: anywhere; }
  .chat-msg.self .chat-text { color: #fff; }
  #chat-form { display: flex; gap: 0.5rem; padding: 0.5rem 1rem; border-top: 1px solid #1a1a1a; align-items: center; }
  #chat-name-input {
    background: #1a1a1a; color: #cda;
    border: 1px solid #2a2a2a; border-radius: 4px;
    padding: 0.4rem 0.55rem; font-size: 0.8rem; font-family: inherit;
    width: 8em; min-width: 0;
  }
  #chat-name-input:focus { outline: none; border-color: #444; }
  #chat-input {
    flex: 1;
    background: #1a1a1a; color: #eee;
    border: 1px solid #2a2a2a; border-radius: 4px;
    padding: 0.4rem 0.6rem; font-size: 0.85rem; font-family: inherit;
    min-width: 0;
  }
  #chat-input:focus { outline: none; border-color: #444; }
  #chat-input:disabled { opacity: 0.5; }
  #chat-send {
    background: #2a2a2a; color: #eee;
    border: 1px solid #333;
    padding: 0.35rem 0.9rem;
    font-size: 0.85rem; border-radius: 4px;
    cursor: pointer; font-family: inherit;
  }
  #chat-send:hover { background: #333; }
  #chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

  :root {
    color-scheme: dark;
    --bg: #080b10;
    --surface: #10151d;
    --surface-2: #151b25;
    --surface-3: #1b2430;
    --line: rgba(148, 163, 184, 0.16);
    --line-strong: rgba(148, 163, 184, 0.26);
    --text: #e6edf5;
    --muted: #91a0b3;
    --dim: #637083;
    --brand: #38bdf8;
    --brand-2: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
  }

  body {
    background:
      radial-gradient(circle at 20% -10%, rgba(56, 189, 248, 0.16), transparent 30rem),
      linear-gradient(180deg, #0c1118 0%, var(--bg) 42%);
    color: var(--text);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 62px;
    padding: 0.75rem clamp(0.85rem, 2vw, 1.5rem);
    background: rgba(11, 15, 21, 0.88);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(18px);
  }
  header h1 {
    font-size: 1.02rem;
    font-weight: 750;
    letter-spacing: 0;
  }
  header h1::before {
    content: "";
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    margin-right: 0.5rem;
    border-radius: 999px;
    background: var(--brand);
    box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.12), 0 0 22px rgba(56, 189, 248, 0.7);
    vertical-align: 0.02em;
  }
  #status, #viewers, #position { color: var(--muted) !important; }
  #status .live {
    background: linear-gradient(135deg, #ef4444, #f97316);
    border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  #now-thumb {
    width: 36px;
    height: 54px;
    border-radius: 6px;
    background: var(--surface-2);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }

  main,
  #player-wrap {
    background:
      linear-gradient(180deg, rgba(15, 23, 42, 0.45), transparent 26%),
      #000;
  }
  video {
    max-height: calc(100vh - 62px);
    box-shadow: var(--shadow);
  }
  #unmute-overlay {
    background: radial-gradient(circle, rgba(8, 13, 20, 0.26), rgba(0, 0, 0, 0.64));
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
  }

  #vol-controls {
    background: rgba(10, 15, 22, 0.76);
    border: 1px solid rgba(226, 232, 240, 0.13);
    border-radius: 999px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.36);
    backdrop-filter: blur(14px);
    opacity: 0.88;
  }
  #vol-controls button {
    border-radius: 999px;
  }
  #vol-controls button:hover {
    background: rgba(255,255,255,0.1);
  }
  #vol-controls input[type="range"] {
    accent-color: var(--brand);
  }

  #queue-panel,
  #request-panel,
  #chat-app,
  #chat {
    background: rgba(13, 18, 26, 0.96);
    border-top: 1px solid var(--line);
  }
  #queue-head,
  #request-head,
  #chat-header {
    min-height: 2.7rem;
    padding: 0.58rem clamp(0.85rem, 2vw, 1.25rem);
    background: linear-gradient(180deg, rgba(21, 27, 37, 0.96), rgba(13, 18, 26, 0.96));
    border-bottom: 1px solid var(--line);
  }
  #queue-head h2,
  #request-head h2,
  #chat-header h2 {
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #queue-count,
  #queue-head .toggle,
  #request-head .toggle,
  #chat-header .toggle {
    color: var(--dim);
  }

  #queue-list,
  #request-results {
    padding: 0.55rem 0;
  }
  #queue-list li,
  #request-results li {
    padding: 0.46rem clamp(0.85rem, 2vw, 1.25rem);
    color: var(--text);
  }
  #queue-list li:hover,
  #request-results li:hover {
    background: rgba(148, 163, 184, 0.06);
  }
  #queue-list .qthumb,
  #request-results .rthumb {
    border-radius: 6px;
    background: var(--surface-3);
    box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  }
  #queue-list .qdur,
  #request-results .rtitle .rt-parent,
  #queue-list .qpos,
  #queue-list .empty,
  #request-results .empty,
  #chat-messages .empty {
    color: var(--dim);
  }
  #request-search,
  #chat-name-input,
  #chat-input {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    min-height: 40px;
    transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
  }
  #request-search {
    width: calc(100% - clamp(1.7rem, 4vw, 2.5rem));
    margin: 0.7rem clamp(0.85rem, 2vw, 1.25rem);
  }
  #request-search:focus,
  #chat-name-input:focus,
  #chat-input:focus {
    border-color: rgba(56, 189, 248, 0.72);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    outline: none;
  }
  #request-results button,
  #chat-send,
  #voteskip-btn,
  #controls-link {
    border-radius: 999px !important;
    border: 1px solid var(--line-strong) !important;
    min-height: 34px;
    font-weight: 700;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  #request-results button,
  #chat-send {
    background: linear-gradient(180deg, #263241, #1b2531);
    color: var(--text);
  }
  #request-results button:hover,
  #chat-send:hover {
    background: linear-gradient(180deg, #304052, #243244);
    transform: translateY(-1px);
  }
  #request-results button.done {
    background: rgba(34, 197, 94, 0.15);
    color: #86efac;
    border-color: rgba(34, 197, 94, 0.34) !important;
  }
  #controls-link {
    background: rgba(56, 189, 248, 0.13) !important;
    color: #7dd3fc !important;
    text-decoration: none !important;
  }
  #voteskip-btn {
    background: rgba(245, 158, 11, 0.14) !important;
    color: #fcd34d !important;
    border-color: rgba(245, 158, 11, 0.3) !important;
  }

  #chat-messages {
    padding: 0.65rem clamp(0.85rem, 2vw, 1.25rem);
  }
  .chat-msg {
    padding: 0.28rem 0;
  }
  .chat-dot {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
  }
  .chat-name {
    color: #cbd5e1;
  }
  .chat-text {
    color: var(--text);
  }
  #chat-form {
    padding: 0.65rem clamp(0.85rem, 2vw, 1.25rem);
    border-top: 1px solid var(--line);
    background: rgba(8, 13, 20, 0.36);
  }

  @media (max-width: 700px) {
    header {
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    header h1 { width: 100%; }
    #status { order: 3; flex-basis: 100%; }
    #position { margin-left: 0 !important; }
    #viewers { margin-left: auto; }
    #vol-controls {
      left: 50%;
      right: auto;
      transform: translateX(-50%);
    }
    #chat-form {
      display: grid;
      grid-template-columns: minmax(0, 7rem) minmax(0, 1fr) auto;
      gap: 0.45rem;
    }
    #chat-name-input { width: 100%; }
  }

  @media (min-width: 960px) {
    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(320px, 24vw, 420px);
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      min-height: 100vh;
    }
    header {
      grid-column: 1 / -1;
    }
    main {
      grid-column: 1;
      grid-row: 2;
      min-height: 0;
    }
    #player-wrap {
      min-height: 0;
      height: 100%;
    }
    video {
      height: 100%;
      max-height: none;
    }
    #queue-panel {
      grid-column: 1;
      grid-row: 3;
    }
    #request-panel {
      grid-column: 1;
      grid-row: 4;
    }
    #chat-app {
      grid-column: 2;
      grid-row: 2 / 5;
      min-height: 0;
      border-left: 1px solid var(--line);
      box-shadow: -18px 0 60px rgba(0,0,0,0.18);
    }
    #chat {
      max-height: none;
      height: 100%;
      min-height: 0;
      border-top: 0;
    }
    #chat.collapsed {
      max-height: none;
      overflow: hidden;
    }
    #chat-header {
      position: sticky;
      top: 62px;
      z-index: 1;
    }
    #chat-messages {
      min-height: 0;
    }
  }
</style>

<body class="viewer-page">
<header>
  <h1>jetstream</h1>
  <span id="now-thumb"><img id="now-thumb-img" alt=""></span>
  <span id="status">waiting…</span>
  <span id="position" style="color:#888;font-size:0.85rem;font-variant-numeric:tabular-nums"></span>
  <span id="viewers"></span>
  <span style="margin-left:auto;display:flex;gap:0.6rem;align-items:center">
    <!-- Vote-to-skip: shown to everyone while something's playing. -->
    <button id="voteskip-btn" type="button" title="Vote to skip the current item"
            style="display:none;font-size:0.85rem;color:#e8b96c;background:#332615;border:1px solid #5a4422;padding:0.25rem 0.6rem;border-radius:4px;cursor:pointer">⏭ Vote skip <span id="voteskip-tally"></span></button>
    <!-- Shown only for friend/admin tokens (see can_control in /api/status). -->
    <a id="controls-link" href="/controls"
       style="display:none;font-size:0.85rem;color:#6cb6ff;text-decoration:none;border:1px solid #244266;background:#1a3050;padding:0.25rem 0.6rem;border-radius:4px">🎛 Controls</a>
  </span>
</header>
<main id="main">
  <div id="player-wrap">
    <video id="video" autoplay playsinline muted
           controlslist="nodownload noremoteplayback noplaybackrate"></video>
    <div id="vol-controls">
      <button id="mute-btn" title="Mute / unmute">🔊</button>
      <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="1" title="Volume">
      <button id="pip-btn" title="Picture in picture" style="display:none">⧉</button>
      <button id="fs-btn" title="Fullscreen" style="display:none">⛶</button>
    </div>
    <div id="unmute-overlay">tap to unmute</div>
  </div>
</main>

<section id="queue-panel" style="display:none">
  <div id="queue-head">
    <h2>up next</h2>
    <span id="queue-count"></span>
    <span class="toggle" id="queue-toggle">▾</span>
  </div>
  <ol id="queue-list"></ol>
</section>

<section id="request-panel">
  <div id="request-head">
    <h2>request something</h2>
    <span class="toggle" id="request-toggle">▸</span>
  </div>
  <input id="request-search" type="search" placeholder="🔍 Search the library…" autocomplete="off">
  <ul id="request-results"><li class="empty">Search the library, then tap Request to ask the host to queue it.</li></ul>
</section>

<div id="chat-app"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
<script type="module" src="/build/viewerChat.js"></script>
<script>
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const nowThumb = document.getElementById("now-thumb");
const nowThumbImg = document.getElementById("now-thumb-img");
let nowThumbPath = null;
function updateNowThumb(s) {
  // Show the small header poster whenever the current source is a FILE
  // (URL / yt-dlp sources don't map to arr inventory and would always 204).
  // Hide on idle. Avoid re-setting src when the path hasn't changed — that
  // would trigger a re-fetch + re-paint every status poll (every second).
  const path = s && s.source_type === "file" ? s.path : null;
  if (path === nowThumbPath) return;
  nowThumbPath = path;
  if (!path) {
    nowThumb.classList.remove("show");
    nowThumbImg.removeAttribute("src");
    return;
  }
  nowThumbImg.onload = () => nowThumb.classList.add("show");
  nowThumbImg.onerror = () => nowThumb.classList.remove("show");
  nowThumb.classList.remove("show");
  nowThumbImg.src = `/poster?path=${encodeURIComponent(path)}`;
}
const viewersEl = document.getElementById("viewers");
const playerWrap = document.getElementById("player-wrap");
const positionEl = document.getElementById("position");
const unmuteOverlay = document.getElementById("unmute-overlay");
const muteBtn = document.getElementById("mute-btn");
const volSlider = document.getElementById("vol-slider");
const fsBtn = document.getElementById("fs-btn");
const pipBtn = document.getElementById("pip-btn");

// Restore the user's last volume choice. Mute state is intentionally NOT
// persisted: the page loads muted (autoplay policy requires it), and the
// existing tap-to-unmute overlay drives that transition.
const savedVol = parseFloat(localStorage.getItem("jetstream_volume"));
if (isFinite(savedVol) && savedVol >= 0 && savedVol <= 1) {
  video.volume = savedVol;
  volSlider.value = String(savedVol);
}

// Feature detection — iPhone Safari uses the webkit-prefixed video APIs
// (no requestFullscreen on divs, no standard requestPictureInPicture).
// The PiP check is intentionally permissive: showing the button whenever
// the API surface *exists* (not whether it currently reports support).
// iOS Safari's webkitSupportsPresentationMode("picture-in-picture") can
// return false at script-load time before the video element has metadata,
// then start returning true after the first segment loads — by then the
// button is permanently hidden. Show it eagerly; the click handler does
// the real check and silently no-ops if PiP can't be entered.
const fsSupported = !!(video.webkitEnterFullscreen || playerWrap.requestFullscreen || video.requestFullscreen);
const pipSupported = !!(
  typeof video.webkitSupportsPresentationMode === "function"
  || document.pictureInPictureEnabled
);
if (fsSupported) fsBtn.style.display = "";
if (pipSupported) pipBtn.style.display = "";

let hls = null;
let lastReady = false;
let serverPaused = false;

function syncMuteUI() {
  // Surface the overlay whenever the user needs to interact: muted (so they
  // can unmute) OR paused while the server is streaming (so they can start
  // playback when iOS Safari blocked autoplay). Don't surface for serverPaused
  // — that's an admin-driven state, not something the viewer should bypass.
  const needsTap = video.muted || (video.paused && !serverPaused);
  unmuteOverlay.classList.toggle("hidden", !needsTap);
  unmuteOverlay.textContent = video.paused && !serverPaused ? "tap to play" : "tap to unmute";
  muteBtn.textContent = video.muted || video.volume === 0 ? "🔇" : "🔊";
  // Mirror the element's volume back onto the slider so programmatic changes
  // (e.g. the unmute overlay bumping volume from 0 to 1) keep the UI in sync.
  const shown = video.muted ? 0 : video.volume;
  if (parseFloat(volSlider.value) !== shown) volSlider.value = String(shown);
}

// Best-effort play(). Just swallow the rejection: the source-swap path on
// Hls.js (setupPlayer's hls-exists branch) preserves the video element's
// playing state across stream restarts, so the autoplay-policy rejection
// that this used to fall back from no longer fires there. The remaining
// rejection sites (initial cold load, tab visibility change) leave the
// element paused, and syncMuteUI surfaces the "tap to play" overlay as
// the recovery affordance — which the user controls. Don't auto-mute on
// rejection: silently demoting the user's audio choice on every transient
// hiccup is worse than a visible overlay they can tap.
function playWithFallback() {
  const p = video.play();
  if (p && typeof p.catch === "function") p.catch(() => {});
}

unmuteOverlay.addEventListener("click", () => {
  video.muted = false;
  if (video.volume === 0) video.volume = 1;
  // Flushing a play() inside the gesture is required: changing `muted=false`
  // can pause the element on iOS Safari, and a later play() from a non-gesture
  // handler is then blocked by autoplay policy and silently dropped.
  video.play().catch(() => {});
  // One-shot snap to the live edge. iOS Safari native HLS can land the user
  // at the buffer start (~24s behind live) when the user-tap is what starts
  // playback, and the drift loop is gated off for Infinity-duration streams,
  // so it can't pull them forward. Doing this once inside the gesture (not
  // on a recurring timer — that caused the iOS stutter+skip loop) gets the
  // viewer in sync without continuous re-seeking.
  snapToLive();
  syncMuteUI();
});
muteBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) video.volume = 1;
  video.play().catch(() => {});
  syncMuteUI();
});
volSlider.addEventListener("input", () => {
  const v = parseFloat(volSlider.value);
  video.volume = v;
  // Dragging the slider above 0 is an explicit "I want sound" gesture — also
  // clears mute so the icon and audio both reflect the user's intent.
  if (v > 0 && video.muted) video.muted = false;
  // Same gesture-driven play() flush as the mute button: changing audio state
  // can leave iOS Safari paused, and a play() outside the gesture is dropped.
  video.play().catch(() => {});
  localStorage.setItem("jetstream_volume", String(v));
  syncMuteUI();
});
fsBtn.addEventListener("click", () => {
  // Prefer the webkit-prefixed video API whenever it exists, regardless of
  // whether the standard Element.requestFullscreen() is also present. iOS
  // Safari 16.4+ added div-level requestFullscreen as a partial implementation
  // that silently rejects on a <div> containing video — the previous guard
  // `&& !playerWrap.requestFullscreen` was correct on pre-16.4 iOS but turned
  // false once Safari shipped the standard surface, sending iOS into the
  // broken fallthrough. Mirror the pip-btn pattern below: webkit-first when
  // it's there, standard path only on non-webkit engines.
  if (typeof video.webkitEnterFullscreen === "function") {
    if (!video.webkitDisplayingFullscreen) video.webkitEnterFullscreen();
    return;
  }
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
    return;
  }
  const target = playerWrap.requestFullscreen ? playerWrap : video;
  const req = target.requestFullscreen;
  const p = req && req.call(target);
  // `.catch` so the rejected-promise path from a partial requestFullscreen
  // implementation doesn't surface as silent failure. Fall back to the bare
  // <video> if the wrap div rejects — covers any UA that ships div-level
  // requestFullscreen but doesn't accept a video-bearing container.
  if (p && typeof p.catch === "function") {
    p.catch(() => {
      if (target === playerWrap && typeof video.requestFullscreen === "function") {
        video.requestFullscreen().catch(() => {});
      }
    });
  }
});
pipBtn.addEventListener("click", async () => {
  // iOS Safari path.
  if (typeof video.webkitSetPresentationMode === "function" && video.webkitSupportsPresentationMode?.("picture-in-picture")) {
    const next = video.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture";
    video.webkitSetPresentationMode(next);
    return;
  }
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
  } catch {}
});

video.addEventListener("pause", syncMuteUI);
video.addEventListener("play", syncMuteUI);
video.addEventListener("playing", syncMuteUI);
// Background-tab autoplay is blocked harder than foreground autoplay on most
// browsers — opening / in a new tab while another tab is active can leave the
// player paused with no recovery. Fire play() (and refresh the source if the
// buffer went stale) when the tab becomes visible.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || serverPaused) return;
  if (video.paused) playWithFallback();
});
function snapToLive() {
  // Never seek past the buffered edge. Firefox/MSE doesn't clamp out-of-buffer
  // seeks like Chrome does — currentTime past buffered.end leaves the playhead
  // in a phantom zone that decodes nothing (black + silent, no error). Hls.js
  // sometimes advances MediaSource.duration ahead of what's actually appended,
  // so duration / seekable.end can both point past the real frames.
  // Prefer hls.liveSyncPosition (live edge − liveSyncDurationCount * target);
  // fall back to the last buffered range minus a small margin; final fallback
  // is seekable.end for native HLS (Safari) where MSE isn't in play.
  let target = null;
  if (hls && typeof hls.liveSyncPosition === "number" && isFinite(hls.liveSyncPosition)) {
    target = hls.liveSyncPosition;
  } else if (video.buffered.length) {
    target = video.buffered.end(video.buffered.length - 1) - 1.0;
  } else if (video.seekable.length) {
    target = video.seekable.end(video.seekable.length - 1);
  }
  if (target != null && isFinite(target) && target >= 0) {
    try { video.currentTime = target; } catch {}
  }
}
// On (re)load, jump straight to the live edge — fires for both Hls.js
// (after MANIFEST_PARSED) and iOS native HLS. Without this, refreshing
// drops the viewer behind admin by the playlist's lookback window.
// Also kick playback here: the `autoplay` attribute races with MSE attach
// on Hls.js and with native-HLS manifest fetch on Safari; explicit play()
// on loadedmetadata is the documented "playback is now safe to start"
// hook and ensures the stream starts on first page load without a tap.
video.addEventListener("loadedmetadata", () => {
  snapToLive();
  if (!serverPaused) playWithFallback();
});
// Continuous server-time sync. Each segment carries an absolute
// `EXT-X-PROGRAM-DATE-TIME`, so we can ask "what wall-clock moment is the
// player rendering right now?" and steer every device toward the SAME
// target (server_now − TARGET_LAG). That makes admin and viewers converge
// on the same playhead instead of each tracking their own buffer.
// Firefox detection — its MSE pipeline doesn't like Hls.js's lowLatencyMode
// the way Chromium does. The lowLatencyMode + liveSyncDurationCount:1 combo
// keeps Chromium glued to a tight live edge but starves Firefox's decoder,
// surfacing as micro-skips every few seconds even with healthy 1 s segments.
// UA sniff is fine here — we only need to recognise Gecko, not distinguish
// forks of it.
const IS_FIREFOX = /Firefox\//i.test(navigator.userAgent);
// playhead = server_now − this. Tighter target for Chromium (which can sit
// 2.5s behind the live edge cleanly); Firefox gets a wider lag so its
// liveSyncDurationCount:3 buffer has room to play out without the snap loop
// pulling the playhead past where Hls.js actually has frames appended.
const TARGET_LAG_S = IS_FIREFOX ? 5.0 : 2.5;
// Drift-correction snap threshold. Firefox's wider lag means casual PDT
// drift looks bigger in absolute seconds — only step in on real desync, not
// every small wobble. Chromium keeps the tighter window.
const DRIFT_SNAP_S = IS_FIREFOX ? 8 : 5;
let serverClockOffsetMs = 0;  // updated by pollStatus from s.server_unix.

function currentPlayingDateMs() {
  // Hls.js path: walks the loaded fragments to map currentTime → PDT.
  if (hls && hls.playingDate instanceof Date) return hls.playingDate.getTime();
  // Native HLS (iOS Safari): startDate + currentTime.
  if (typeof video.getStartDate === "function") {
    const start = video.getStartDate();
    if (start && !isNaN(start.getTime())) return start.getTime() + video.currentTime * 1000;
  }
  return null;
}

// PDT-based sync. Rate steering was previously enabled (±1.5%) to keep devices
// within ~1s of each other, but Firefox's audio resampler stutters audibly on
// software h264 decode at 1080p when playbackRate ≠ 1.0 — the cure was worse
// than the disease. Now: keep playbackRate pinned at 1.0 and only intervene
// on big drift via snapToLive(). Trade-off is ~2-3s skew between devices,
// which is fine for casual co-watching.
try { video.preservesPitch = true; } catch {}
setInterval(() => {
  if (!video.duration || !isFinite(video.duration)) return;
  if (video.paused || serverPaused) return;
  if (video.playbackRate !== 1.0) video.playbackRate = 1.0;
  const playing = currentPlayingDateMs();
  if (playing == null) return;
  const serverNowMs = Date.now() + serverClockOffsetMs;
  const drift = (serverNowMs - playing) / 1000 - TARGET_LAG_S;
  if (Math.abs(drift) > DRIFT_SNAP_S) snapToLive();
}, 2000);
// Disable space-bar pause and right-click menu — but only when no text
// input is focused, otherwise the chat box can't take spaces.
document.addEventListener("keydown", e => {
  if (e.key !== " " && e.code !== "Space") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  e.preventDefault();
});
video.addEventListener("contextmenu", e => e.preventDefault());

video.addEventListener("volumechange", syncMuteUI);
syncMuteUI();

let playerChromeTimer = null;
function shouldHidePlayerChrome() {
  return !video.paused && !video.muted && !serverPaused && unmuteOverlay.classList.contains("hidden");
}
function showPlayerChrome() {
  playerWrap.classList.remove("controls-idle");
  playerWrap.classList.add("controls-active");
  clearTimeout(playerChromeTimer);
  if (shouldHidePlayerChrome()) {
    playerChromeTimer = setTimeout(() => {
      if (shouldHidePlayerChrome()) {
        playerWrap.classList.remove("controls-active");
        playerWrap.classList.add("controls-idle");
      }
    }, 1800);
  }
}
function keepPlayerChromeVisible() {
  clearTimeout(playerChromeTimer);
  playerWrap.classList.remove("controls-idle");
  playerWrap.classList.add("controls-active");
}
["pointermove", "mousemove", "touchstart", "keydown", "focusin"].forEach((eventName) => {
  playerWrap.addEventListener(eventName, showPlayerChrome, { passive: true });
});
["play", "playing", "volumechange"].forEach((eventName) => {
  video.addEventListener(eventName, showPlayerChrome);
});
["pause", "waiting", "ended"].forEach((eventName) => {
  video.addEventListener(eventName, keepPlayerChromeVisible);
});
showPlayerChrome();

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function basename(p) { return (p || "").split("/").pop(); }
function formatTime(sec) {
  if (!sec || !isFinite(sec) || sec < 0) return "0:00";
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function setupPlayer() {
  // Cache-buster forces iOS Safari (native HLS) to re-fetch the manifest on
  // stream restarts; without it, reusing the same URL is sometimes treated
  // as cached 404.
  const src = "/hls/stream.m3u8?_=" + Date.now();
  // Server-side composer keeps /hls/stream.m3u8 alive across every source
  // change, seek, pause/resume — so setupPlayer is only ever called for the
  // cold load and post-fatal-error recovery, both of which start with hls=null.
  // No more "swap source" branch needed.
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src;
    // Trigger a fresh load even if Safari thinks the src is unchanged.
    video.load();
    // Don't call play() here — iOS Safari's `autoplay muted playsinline`
    // combo handles the start natively, and an explicit play() before the
    // manifest is fetched can put the element in a failed-play state that
    // suppresses autoplay. The `loadedmetadata`/`canplay` handlers cover
    // the case where autoplay still doesn't kick in.
  } else if (window.Hls && Hls.isSupported()) {
    // Match admin's tuning: 1-segment live-edge headroom keeps lag tight and
    // avoids the constant snap-to-live hammering that the previous 3-segment
    // setting caused with PDT-drift correction. The encode side now forces
    // IDR frames at exact segment boundaries (see app.py force_key_frames),
    // so each segment is independently decodable and Firefox doesn't stall
    // on mid-GOP segment starts.
    // Firefox MSE: starves on lowLatencyMode + 1-segment buffer, surfacing as
    // periodic micro-skips even with healthy 1 s segments. Wider headroom +
    // standard latency mode lets Gecko's decoder stay ahead of presentation.
    // Chromium keeps the tighter Chrome-optimised config it's always had.
    hls = new Hls(IS_FIREFOX
      ? { lowLatencyMode: false, liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10 }
      : { lowLatencyMode: true, liveSyncDurationCount: 1 });
    hls.loadSource(src);
    hls.attachMedia(video);
    // Explicit play() after attach — iOS Safari can leave the element paused
    // after attachMedia otherwise.
    playWithFallback();
    // Belt-and-suspenders snap-to-live. The video element's `loadedmetadata`
    // handler also calls snapToLive(), but that fires when video.duration
    // becomes a number — which on Hls.js can happen BEFORE the live edge is
    // computable, leaving the snap a no-op. MANIFEST_PARSED fires once the
    // playlist is loaded and hls.liveSyncPosition is set, giving us a
    // reliable second jump that catches any case where the metadata-driven
    // snap landed too early.
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      snapToLive();
      if (!serverPaused) playWithFallback();
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        // Real media error — destroy + retry once. Pause no longer 404s the
        // manifest (composer keeps it live), so we don't need a special-case
        // branch for serverPaused here.
        hardTeardown();
        setTimeout(setupPlayer, 800);
      }
    });
  } else {
    statusEl.textContent = "HLS not supported in this browser";
    return;
  }
  syncMuteUI();
}

function hardTeardown() {
  // Used by fatal-error recovery and full-idle teardown. Releases MSE and
  // forces the next setupPlayer to recreate the Hls.js instance from
  // scratch. The next play() may need a user gesture on autoplay-strict
  // browsers.
  if (hls) { hls.destroy(); hls = null; }
}
function teardownPlayer() {
  // Used when the server is fully idle. Frees the source so the box can
  // sit dormant rather than holding a stale frame.
  hardTeardown();
  video.removeAttribute("src");
  video.load();
}

async function pollStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    // Reveal the Controls link once we know this token can drive playback.
    if (s.can_control) {
      const cl = document.getElementById("controls-link");
      if (cl) cl.style.display = "";
    }
    if (s.playing) {
      // No more per-source-change teardown: the server's composer keeps
      // /hls/stream.m3u8 live across seeks, queue advances, pause/resume,
      // and admin source-swaps. Each ffmpeg run writes into its own
      // /hls/run/<id>/ subdir and the master playlist accumulates them
      // separated by EXT-X-DISCONTINUITY, so the player just keeps reading
      // the same URL forever.
      const label = s.title || basename(s.path) || "live";
      const liveLabel = s.paused
        ? '<span class="live" style="background:#888">PAUSED</span>'
        : '<span class="live">LIVE</span>';
      statusEl.innerHTML = `${liveLabel}${escapeHtml(label)}`;
      document.title = label + " · jetstream";
      updateNowThumb(s);
      serverPaused = !!s.paused;
      if (s.ready && !lastReady) setupPlayer();
      lastReady = s.ready;
      // Mirror server pause state on the local player.
      if (serverPaused && !video.paused) video.pause();
      if (!serverPaused && video.paused) {
        playWithFallback();
      }
      // Position display. For live URLs (no duration), just show elapsed.
      if (s.is_live) {
        positionEl.textContent = "LIVE";
      } else if (s.position_seconds != null && s.duration_seconds) {
        positionEl.textContent = `${formatTime(s.position_seconds)} / ${formatTime(s.duration_seconds)}`;
      } else if (s.position_seconds != null) {
        positionEl.textContent = formatTime(s.position_seconds);
      } else {
        positionEl.textContent = "";
      }
    } else {
      statusEl.textContent = "idle";
      document.title = "jetstream";
      serverPaused = false;
      if (lastReady) teardownPlayer();
      lastReady = false;
      positionEl.textContent = "";
      updateNowThumb(null);
    }
    const v = s.viewers || 0;
    viewersEl.textContent = v ? `${v} viewer${v === 1 ? "" : "s"}` : "";
    updateVoteSkip(s);
    // Refresh the client/server clock offset so the sync interval can target
    // an absolute server moment instead of the device's potentially-skewed
    // local clock. Recomputed every poll so drift and NTP corrections track.
    if (typeof s.server_unix === "number") {
      serverClockOffsetMs = s.server_unix * 1000 - Date.now();
    }
  } catch (e) {}
}

// ---- Vote to skip -----------------------------------------------------
// Everyone watching can vote; a majority of active viewers skips the item.
// The button toggles the local vote; the tally comes from /api/status so all
// clients see it converge. `myVote` is per-tab UI state (the server keys votes
// by IP, so it's authoritative — this just styles the button).
const voteSkipBtn = document.getElementById("voteskip-btn");
const voteSkipTally = document.getElementById("voteskip-tally");
let myVote = false;

function updateVoteSkip(s) {
  if (!s || !s.playing) {
    voteSkipBtn.style.display = "none";
    myVote = false;
    return;
  }
  voteSkipBtn.style.display = "";
  const votes = s.skip_votes || 0, needed = s.skip_needed || 1;
  voteSkipTally.textContent = `${votes}/${needed}`;
  // Once the tally drops to 0 (item skipped / votes reset), clear our local
  // "voted" highlight.
  if (votes === 0) myVote = false;
  voteSkipBtn.style.background = myVote ? "#5a4422" : "#332615";
}

voteSkipBtn.addEventListener("click", async () => {
  voteSkipBtn.disabled = true;
  try {
    const r = await fetch("/api/vote_skip", { method: "POST" });
    if (r.ok) {
      const j = await r.json();
      myVote = !!j.voted;
      voteSkipTally.textContent = `${j.votes}/${j.needed}`;
      voteSkipBtn.style.background = myVote ? "#5a4422" : "#332615";
      if (j.skipped) myVote = false;
    }
  } catch {}
  voteSkipBtn.disabled = false;
});

// Kick the player up before the first /api/status round-trip so playback
// starts the instant the page renders. If the manifest 404s (server idle),
// the Hls.js fatal-error handler retries 800ms later.
setupPlayer();
pollStatus();
// 1s poll — pause/skip from admin reaches the viewer within one tick.
setInterval(pollStatus, 1000);

let chatSid = localStorage.getItem("jetstream_chatsid");
if (!chatSid) {
  chatSid = [...crypto.getRandomValues(new Uint8Array(6))]
    .map(b => b.toString(16).padStart(2, "0")).join("");
  localStorage.setItem("jetstream_chatsid", chatSid);
}

// ---- Up-next queue (read-only) ----------------------------------------
// Viewers see what's coming but can't touch it — adding/reordering stays on
// the control surface. Panel hides itself when the queue is empty.
const queuePanel = document.getElementById("queue-panel");
const queueList = document.getElementById("queue-list");
const queueCount = document.getElementById("queue-count");
const queueToggle = document.getElementById("queue-toggle");
if (localStorage.getItem("jetstream_queue_collapsed") === "1") {
  queuePanel.classList.add("collapsed");
  queueToggle.textContent = "▸";
}
document.getElementById("queue-head").addEventListener("click", () => {
  const c = queuePanel.classList.toggle("collapsed");
  queueToggle.textContent = c ? "▸" : "▾";
  localStorage.setItem("jetstream_queue_collapsed", c ? "1" : "0");
});
async function queuePoll() {
  try {
    const r = await fetch("/api/queue");
    if (!r.ok) return;
    const q = (await r.json()).queue || [];
    if (!q.length) { queuePanel.style.display = "none"; return; }
    queuePanel.style.display = "";
    queueCount.textContent = q.length + (q.length === 1 ? " item" : " items");
    queueList.innerHTML = "";
    q.forEach((it, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="qpos"></span><span class="qthumb"><img loading="lazy" alt=""></span><span class="qtitle"></span><span class="qdur"></span>`;
      li.querySelector(".qpos").textContent = i + 1;
      li.querySelector(".qtitle").textContent = it.title || "(untitled)";
      li.querySelector(".qdur").textContent =
        it.is_live ? "LIVE" : (it.duration ? formatTime(it.duration) : "");
      if (it.type === "file" && it.ref) {
        const img = li.querySelector(".qthumb img");
        img.addEventListener("load", () => img.classList.add("loaded"));
        img.src = `/poster?path=${encodeURIComponent(it.ref)}`;
      }
      queueList.appendChild(li);
    });
  } catch {}
}
setInterval(queuePoll, 5000);
queuePoll();

// ---- Request something -------------------------------------------------
// Watch-only viewers can't drive playback, but they can search the library
// and ask the host to queue an item. The request lands in a pending list the
// host approves/denies (see admin.html "Requests"). Collapsed by default so
// it stays out of the way until a viewer goes looking. Reuses the chat name
// (jetstream_chatname) as the requester so the host sees who asked.
const requestPanel = document.getElementById("request-panel");
const requestToggle = document.getElementById("request-toggle");
const requestSearch = document.getElementById("request-search");
const requestResults = document.getElementById("request-results");
if (localStorage.getItem("jetstream_request_collapsed") !== "0") {
  // Default collapsed — only expand if the viewer explicitly opened it before.
  requestPanel.classList.add("collapsed");
  requestToggle.textContent = "▸";
} else {
  requestToggle.textContent = "▾";
}
document.getElementById("request-head").addEventListener("click", () => {
  const c = requestPanel.classList.toggle("collapsed");
  requestToggle.textContent = c ? "▸" : "▾";
  localStorage.setItem("jetstream_request_collapsed", c ? "1" : "0");
});

let requestSeq = 0;
async function requestDoSearch(q) {
  const seq = ++requestSeq;
  requestResults.innerHTML = '<li class="empty">Searching…</li>';
  try {
    const r = await fetch("/api/library/search?q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (seq !== requestSeq) return;  // a newer keystroke superseded this
    const results = j.results || [];
    if (!results.length) {
      requestResults.innerHTML = `<li class="empty">No matches for “${escapeHtml(q)}”</li>`;
      return;
    }
    requestResults.innerHTML = "";
    for (const it of results) {
      const li = document.createElement("li");
      // Wrap title + parent in a column so meaningless scene-rip filenames
      // (clue-sun401.avi) reveal which show they belong to (the folder).
      li.innerHTML = `<span class="rthumb"><img loading="lazy" alt=""></span><span class="rtitle"><span class="rt-name"></span><span class="rt-parent"></span></span><button type="button">Request</button>`;
      li.querySelector(".rt-name").textContent = it.name;
      if (it.path && it.path.includes("/")) {
        li.querySelector(".rt-parent").textContent =
          "↳ " + it.path.substring(0, it.path.lastIndexOf("/"));
      }
      if (it.path) {
        const img = li.querySelector(".rthumb img");
        img.addEventListener("load", () => img.classList.add("loaded"));
        img.src = `/poster?path=${encodeURIComponent(it.path)}`;
      }
      const btn = li.querySelector("button");
      btn.addEventListener("click", () => sendRequest(it.path, btn));
      requestResults.appendChild(li);
    }
  } catch {
    if (seq === requestSeq) requestResults.innerHTML = '<li class="empty">Search failed.</li>';
  }
}

let requestDebounce = null;
requestSearch.addEventListener("input", () => {
  const q = requestSearch.value.trim();
  clearTimeout(requestDebounce);
  if (!q) {
    requestResults.innerHTML = '<li class="empty">Search the library, then tap Request to ask the host to queue it.</li>';
    return;
  }
  requestDebounce = setTimeout(() => requestDoSearch(q), 250);
});

async function sendRequest(path, btn) {
  btn.disabled = true;
  try {
    const r = await fetch("/api/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        path,
        name: localStorage.getItem("jetstream_chatname") || "",
      }),
    });
    if (r.ok) {
      // Same inline confirmation whether it's new or a fold-into-existing dup —
      // the viewer just needs to know it's been registered.
      btn.textContent = "Requested ✓";
      btn.classList.add("done");
    } else {
      const j = await r.json().catch(() => ({}));
      btn.textContent = j.error === "rate limited" ? "slow down" : "failed";
      btn.disabled = false;
      setTimeout(() => { btn.textContent = "Request"; }, 1800);
    }
  } catch {
    btn.textContent = "failed";
    btn.disabled = false;
    setTimeout(() => { btn.textContent = "Request"; }, 1800);
  }
}

</script>
</body>
