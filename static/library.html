<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jetstream — library</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2310100f"/><path d="M18 44V18l26 13-26 13z" fill="%23dfdedd"/></svg>'>
<link rel="stylesheet" href="/css/library.css">
<link rel="stylesheet" href="/jetstream-theme.css">
</head>
<body>
<header>
  <h1>jetstream <span>library</span></h1>
  <input id="search" type="search" placeholder="Search movies and shows…" autocomplete="off">
  <a id="live-link" href="/">← Live stream</a>
  <span id="who"></span>
  <button id="logout-btn" type="button">Log out</button>
</header>

<section id="library-view">
  <section id="request-section" aria-labelledby="request-heading">
    <div id="request-head">
      <div>
        <h2 id="request-heading">Request something new</h2>
        <p>Search movies and shows that are not in your library yet.</p>
      </div>
      <button id="request-toggle" type="button" aria-expanded="false">Open</button>
    </div>
    <div id="request-body" hidden>
      <form id="request-search-form">
        <input id="request-query" type="search" placeholder="Movie or show title…" autocomplete="off">
        <button id="request-search-btn" type="submit">Search</button>
      </form>
      <div id="request-status" aria-live="polite"></div>
      <ul id="request-results"></ul>
    </div>
  </section>
  <section id="continue-section" hidden aria-labelledby="continue-heading">
    <h2 id="continue-heading">Continue watching</h2>
    <ul id="continue-list"></ul>
  </section>
  <div id="library-nav">
    <button id="library-back" type="button" disabled>Back</button>
    <span id="library-path">Library</span>
  </div>
  <ul id="results"></ul>
</section>

<section id="player-view" hidden>
  <div id="player-title-row">
    <button id="player-close" type="button">← Library</button>
    <span id="player-title"></span>
  </div>
  <div id="player-wrap">
    <video id="video" playsinline
           controlslist="nodownload noremoteplayback noplaybackrate"></video>
    <div id="play-overlay" class="hidden">tap to play</div>
  </div>
  <div id="vod-controls">
    <button id="play-btn" title="Play / pause">▶</button>
    <span id="time-label">0:00 / 0:00</span>
    <input id="seek-bar" type="range" min="0" max="100" step="0.1" value="0" disabled>
    <span id="cc-wrap">
      <button id="cc-btn" type="button" title="Subtitles"
              aria-haspopup="menu" aria-expanded="false" aria-label="Subtitles">CC</button>
      <div id="cc-menu" role="menu" aria-label="Subtitles" hidden></div>
    </span>
    <button id="mute-btn" title="Mute / unmute">🔊</button>
    <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="1" title="Volume">
    <button id="fs-btn" title="Fullscreen" style="display:none">⛶</button>
  </div>
</section>

<div id="toast"></div>

<!-- Vendored (was cdn.jsdelivr.net) — see viewer.html; that CDN is on common
     adblock filter lists, which silently kills playback. -->
<script src="/vendor/hls.min.js"></script>
<script>
const video = document.getElementById("video");
const playerWrap = document.getElementById("player-wrap");
const playerView = document.getElementById("player-view");
const libraryView = document.getElementById("library-view");
const playerTitle = document.getElementById("player-title");
const playOverlay = document.getElementById("play-overlay");
const playBtn = document.getElementById("play-btn");
const timeLabel = document.getElementById("time-label");
const seekBar = document.getElementById("seek-bar");
const muteBtn = document.getElementById("mute-btn");
const volSlider = document.getElementById("vol-slider");
const fsBtn = document.getElementById("fs-btn");
const ccWrap = document.getElementById("cc-wrap");
const ccBtn = document.getElementById("cc-btn");
const ccMenu = document.getElementById("cc-menu");
const toastEl = document.getElementById("toast");

function basename(p) { return (p || "").split("/").pop(); }
function formatTime(sec) {
  if (!sec || !isFinite(sec) || sec < 0) return "0:00";
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.remove("actionable");
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3500);
}

// Same toast, plus one inline button (e.g. "Start over" on a resume notice).
// Needs pointer-events back on, hence the .actionable class.
function toastWithAction(msg, actionLabel, onAction, ms) {
  const text = document.createElement("span");
  text.className = "toast-text";
  text.textContent = msg;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "toast-action";
  btn.textContent = actionLabel;
  btn.addEventListener("click", () => {
    toastEl.classList.remove("show", "actionable");
    clearTimeout(toastTimer);
    onAction();
  });
  toastEl.replaceChildren(text, btn);
  toastEl.classList.add("show", "actionable");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show", "actionable"), ms || 8000);
}

// ---- Who am I / logout -------------------------------------------------
const whoEl = document.getElementById("who");
(async () => {
  try {
    const r = await fetch("/api/auth/me");
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (r.ok) {
      const j = await r.json();
      whoEl.textContent = j.username || "";
    }
  } catch {}
})();
document.getElementById("logout-btn").addEventListener("click", async () => {
  await stopVod();
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch {}
  location.href = "/login";
});

// ---- Library browser ---------------------------------------------------
// Same navigation model + display prettifying as viewer.html's request panel
// (Back button + path label, TV-show season grouping labels, poster tiles).
const searchInput = document.getElementById("search");
const results = document.getElementById("results");
const libraryBack = document.getElementById("library-back");
const libraryPath = document.getElementById("library-path");
let browseSeq = 0;
let libPathCurrent = "";

function libraryLabel(path) {
  if (!path) return "Library";
  const parts = path.split("/").filter(Boolean);
  const labels = [];
  for (let idx = 0; idx < parts.length; idx++) {
    const part = parts[idx];
    const low = part.toLowerCase();
    if (low === "__season__") {
      const season = Number(parts[idx + 1]);
      labels.push(season === 0 ? "Specials" : `Season ${Number.isFinite(season) ? season : parts[idx + 1]}`);
      idx++;
      continue;
    }
    if (idx === 0 && low === "tv") labels.push("TV Shows");
    else if (idx === 0 && (low === "movie" || low === "movies")) labels.push("Movies");
    else labels.push(part);
  }
  return labels.join(" / ");
}

function parentLibraryPath(path) {
  const parts = (path || "").split("/").filter(Boolean);
  if (parts.length >= 2 && parts[parts.length - 2].toLowerCase() === "__season__") {
    parts.splice(parts.length - 2, 2);
  } else {
    parts.pop();
  }
  return parts.join("/");
}

function requestParent(path) {
  return path && path.includes("/") ? path.substring(0, path.lastIndexOf("/")) : "";
}

function pathParts(item) {
  return (item.path || item.name || "").toLowerCase().split("/").filter(Boolean);
}
function isMovieDirectory(item) {
  const parts = pathParts(item);
  return (parts[0] === "movies" || parts[0] === "movie") && parts.length >= 2;
}
function isTvShowDirectory(item) {
  const parts = pathParts(item);
  return parts[0] === "tv" && parts.length === 2;
}
function friendlyDirectoryName(item) {
  if (item.viewer_root) return item.name || basename(item.path);
  const low = (item.path || item.name || "").toLowerCase();
  if (low === "tv" || low.endsWith("/tv")) return "TV Shows";
  if (low === "movie" || low === "movies" || low.endsWith("/movie") || low.endsWith("/movies")) return "Movies";
  return item.name || basename(item.path);
}

// DOM-built cards (no innerHTML — everything here is user/library data).
function makeCard() {
  const li = document.createElement("li");
  const thumb = document.createElement("span");
  thumb.className = "rthumb";
  const title = document.createElement("span");
  title.className = "rtitle";
  const name = document.createElement("span");
  name.className = "rt-name";
  const parent = document.createElement("span");
  parent.className = "rt-parent";
  title.appendChild(name);
  title.appendChild(parent);
  li.appendChild(thumb);
  li.appendChild(title);
  return { li, thumb, name, parent };
}

function emptyRow(msg) {
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = msg;
  return li;
}

function setResults(...nodes) {
  results.replaceChildren(...nodes);
}

function renderFileResult(item, subtitle = "") {
  const { li, thumb, name, parent } = makeCard();
  name.textContent = item.name || basename(item.path) || "(untitled)";
  parent.textContent = subtitle;
  if (item.path) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.addEventListener("load", () => img.classList.add("loaded"));
    img.src = `/poster?path=${encodeURIComponent(item.path)}`;
    thumb.appendChild(img);
  }
  li.addEventListener("click", () => startVod(item));
  return li;
}

function renderDirectoryResult(item) {
  const { li, thumb, name, parent } = makeCard();
  // Start with no thumbnail at all. The tile is only added back if a poster
  // actually loads, so a directory never shows an empty placeholder box.
  thumb.remove();
  li.classList.add("no-thumb");
  if ((isMovieDirectory(item) || isTvShowDirectory(item)) && item.path) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.addEventListener("load", () => {
      thumb.appendChild(img);
      img.classList.add("loaded");
      li.insertBefore(thumb, li.firstChild);
      li.classList.remove("no-thumb");
    });
    img.src = `/poster?path=${encodeURIComponent(item.path)}`;
  }
  name.textContent = friendlyDirectoryName(item);
  parent.textContent = item.path ? libraryLabel(item.path) : "";
  li.addEventListener("click", () => browseLibrary(item.path || ""));
  return li;
}

function renderBrowseItems(items) {
  libraryPath.textContent = libraryLabel(libPathCurrent);
  libraryBack.disabled = !libPathCurrent;
  const dirs = items.filter(it => it.type === "directory");
  const files = items.filter(it => it.type === "file");
  const rows = [...dirs, ...files];
  if (!rows.length) {
    setResults(emptyRow("Nothing here."));
    return;
  }
  setResults(...rows.map(it =>
    it.type === "directory" ? renderDirectoryResult(it) : renderFileResult(it, requestParent(it.path))));
}

async function browseLibrary(path) {
  const seq = ++browseSeq;
  libPathCurrent = path || "";
  searchInput.value = "";
  libraryPath.textContent = libraryLabel(libPathCurrent);
  libraryBack.disabled = !libPathCurrent;
  setResults(emptyRow("Loading library…"));
  try {
    const url = "/api/user/library/browse" + (libPathCurrent ? "?path=" + encodeURIComponent(libPathCurrent) : "");
    const r = await fetch(url);
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const items = await r.json();
    if (seq !== browseSeq) return;
    renderBrowseItems(Array.isArray(items) ? items : []);
  } catch {
    if (seq === browseSeq) setResults(emptyRow("Library failed to load."));
  }
}

async function doSearch(q) {
  const seq = ++browseSeq;
  libraryPath.textContent = "Search";
  libraryBack.disabled = !libPathCurrent;
  setResults(emptyRow("Searching…"));
  try {
    const r = await fetch("/api/user/library/search?q=" + encodeURIComponent(q));
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (seq !== browseSeq) return;  // a newer keystroke superseded this
    const list = j.results || [];
    if (!list.length) {
      setResults(emptyRow(`No matches for “${q}”`));
      return;
    }
    setResults(...list.map(it => {
      const parent = it.path && it.path.includes("/") ? "↳ " + requestParent(it.path) : "";
      return renderFileResult(it, parent);
    }));
  } catch {
    if (seq === browseSeq) setResults(emptyRow("Search failed."));
  }
}

// ---- Request something new --------------------------------------------
const requestToggle = document.getElementById("request-toggle");
const requestBody = document.getElementById("request-body");
const requestForm = document.getElementById("request-search-form");
const requestQuery = document.getElementById("request-query");
const requestSearchBtn = document.getElementById("request-search-btn");
const requestResults = document.getElementById("request-results");
const requestStatus = document.getElementById("request-status");
let requestSeq = 0;

function requestKindLabel(kind) {
  return kind === "series" ? "Series" : "Movie";
}

function statusLabel(status) {
  if (status === "approved") return "approved";
  if (status === "rejected") return "rejected";
  if (status === "downloading") return "downloading";
  if (status === "available") return "available";
  if (status === "failed") return "failed";
  return "pending";
}

function setRequestRows(...nodes) {
  requestResults.replaceChildren(...nodes);
}

function renderRequestChip(item) {
  const chip = document.createElement("span");
  const status = statusLabel(item.status);
  chip.className = "request-chip " + status;
  const strong = document.createElement("strong");
  strong.textContent = item.title || "(untitled)";
  const meta = document.createElement("span");
  meta.textContent = status;
  chip.appendChild(strong);
  chip.appendChild(meta);
  return chip;
}

async function loadMediaRequests() {
  try {
    const r = await fetch("/api/media/requests");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const items = Array.isArray(j.requests) ? j.requests.slice(0, 5) : [];
    requestStatus.replaceChildren(...items.map(renderRequestChip));
  } catch {
    requestStatus.replaceChildren();
  }
}

function requestPayload(item) {
  return {
    kind: item.kind,
    title: item.title,
    year: item.year,
    tmdb_id: item.tmdb_id,
    tvdb_id: item.tvdb_id,
    poster_url: item.poster_url,
    seasons: item.seasons,
  };
}

async function submitMediaRequest(item, button) {
  button.disabled = true;
  const original = button.textContent;
  button.textContent = "Requesting…";
  try {
    const r = await fetch("/api/media/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestPayload(item)),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (r.status === 409) {
      button.textContent = j.error === "already in library" ? "In library" : "Requested";
      await loadMediaRequests();
      return;
    }
    if (!r.ok) throw new Error(j.error || "request failed");
    button.textContent = "Requested";
    toast("Request sent.");
    await loadMediaRequests();
  } catch {
    button.disabled = false;
    button.textContent = original;
    toast("Couldn't send that request — try again.");
  }
}

function renderMediaSearchResult(item) {
  const li = document.createElement("li");
  const poster = document.createElement("span");
  poster.className = "req-poster";
  poster.textContent = requestKindLabel(item.kind);
  if (item.poster_url) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.addEventListener("load", () => poster.replaceChildren(img));
    img.addEventListener("error", () => {
      poster.textContent = requestKindLabel(item.kind);
    });
    img.src = item.poster_url;
  }

  const main = document.createElement("span");
  main.className = "req-main";
  const title = document.createElement("span");
  title.className = "req-title";
  title.textContent = item.title || "(untitled)";
  const meta = document.createElement("span");
  meta.className = "req-meta";
  const year = item.year ? " • " + item.year : "";
  meta.textContent = requestKindLabel(item.kind) + year;
  const overview = document.createElement("span");
  overview.className = "req-overview";
  overview.textContent = item.overview || "No overview available.";
  const action = document.createElement("button");
  action.type = "button";
  action.className = "req-action";
  if (item.already_have) {
    action.textContent = "In library";
    action.disabled = true;
  } else if (item.already_requested) {
    action.textContent = "Requested";
    action.disabled = true;
  } else {
    action.textContent = "Request";
    action.addEventListener("click", () => submitMediaRequest(item, action));
  }
  main.appendChild(title);
  main.appendChild(meta);
  main.appendChild(overview);
  main.appendChild(action);
  li.appendChild(poster);
  li.appendChild(main);
  return li;
}

async function searchMediaRequests(q) {
  const seq = ++requestSeq;
  requestSearchBtn.disabled = true;
  requestSearchBtn.textContent = "Searching…";
  setRequestRows(emptyRow("Searching Radarr and Sonarr…"));
  try {
    const r = await fetch("/api/media/search?q=" + encodeURIComponent(q));
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (seq !== requestSeq) return;
    const list = Array.isArray(j.results) ? j.results : [];
    if (!list.length) {
      const msg = (j.errors || []).length
        ? "Search is unavailable right now."
        : `No request matches for "${q}".`;
      setRequestRows(emptyRow(msg));
      return;
    }
    setRequestRows(...list.map(renderMediaSearchResult));
  } catch {
    if (seq === requestSeq) setRequestRows(emptyRow("Search failed."));
  } finally {
    if (seq === requestSeq) {
      requestSearchBtn.disabled = false;
      requestSearchBtn.textContent = "Search";
    }
  }
}

requestToggle.addEventListener("click", () => {
  const open = requestBody.hidden;
  requestBody.hidden = !open;
  requestToggle.textContent = open ? "Close" : "Open";
  requestToggle.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) {
    loadMediaRequests();
    setTimeout(() => requestQuery.focus(), 0);
  }
});

requestForm.addEventListener("submit", ev => {
  ev.preventDefault();
  const q = requestQuery.value.trim();
  if (q.length < 2) {
    setRequestRows(emptyRow("Type at least two characters."));
    return;
  }
  searchMediaRequests(q);
});

loadMediaRequests();

let searchDebounce = null;
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim();
  clearTimeout(searchDebounce);
  // The Continue-watching row belongs to the browse view only.
  continueSuppressed = !!q;
  syncContinueVisibility();
  if (!q) {
    browseLibrary(libPathCurrent);
    return;
  }
  searchDebounce = setTimeout(() => doSearch(q), 300);
});

libraryBack.addEventListener("click", () => {
  if (!libPathCurrent) return;
  browseLibrary(parentLibraryPath(libPathCurrent));
});

browseLibrary("");

// ---- Continue watching -------------------------------------------------
// Server-side per-user resume points. The row lives above the browser and is
// hidden entirely when empty or while search results are showing.
const continueSection = document.getElementById("continue-section");
const continueList = document.getElementById("continue-list");
let continueCount = 0;
let continueSuppressed = false;   // true while search results replace the browse view
let continueSeq = 0;

function syncContinueVisibility() {
  continueSection.hidden = continueSuppressed || continueCount === 0;
}

function formatRemaining(sec) {
  if (!isFinite(sec) || sec <= 0) return "";
  const mins = Math.round(sec / 60);
  if (mins < 1) return "under a minute left";
  if (mins < 60) return mins + " min left";
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h} h ${m} min left` : `${h} h left`;
}

async function dismissContinue(item, li) {
  try {
    const r = await fetch("/api/user/continue", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: item.path }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch {
    toast("Couldn't remove that — try again.");
    return;
  }
  li.remove();
  continueCount = Math.max(0, continueCount - 1);
  syncContinueVisibility();
}

function renderContinueCard(item) {
  const { li, thumb, name, parent } = makeCard();
  const title = item.title || basename(item.path) || "(untitled)";
  name.textContent = title;
  parent.textContent = requestParent(item.path || "");
  if (item.path) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.addEventListener("load", () => img.classList.add("loaded"));
    img.src = `/poster?path=${encodeURIComponent(item.path)}`;
    thumb.appendChild(img);
  }

  const pct = Math.min(100, Math.max(0, Number(item.percent) || 0));
  const bar = document.createElement("span");
  bar.className = "rc-bar";
  const fill = document.createElement("span");
  fill.className = "rc-bar-fill";
  fill.style.width = pct + "%";
  bar.appendChild(fill);
  li.appendChild(bar);

  const dur = (typeof item.duration === "number" && isFinite(item.duration)) ? item.duration : null;
  if (dur) {
    const left = document.createElement("span");
    left.className = "rc-left";
    left.textContent = formatRemaining(dur - (Number(item.position) || 0));
    li.appendChild(left);
  }

  const dismiss = document.createElement("button");
  dismiss.type = "button";
  dismiss.className = "rc-dismiss";
  dismiss.textContent = "✕";
  dismiss.setAttribute("aria-label", "Remove " + title + " from Continue watching");
  dismiss.addEventListener("click", ev => {
    ev.stopPropagation();   // don't let the dismiss double as a play tap
    dismissContinue(item, li);
  });
  li.appendChild(dismiss);

  // No explicit start → the server resumes from the saved position.
  li.addEventListener("click", () => startVod({ path: item.path, name: title }));
  return li;
}

async function loadContinueRow() {
  const seq = ++continueSeq;
  let items = [];
  try {
    const r = await fetch("/api/user/continue");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (Array.isArray(j.items)) items = j.items;
  } catch {
    items = [];
  }
  if (seq !== continueSeq) return;
  continueCount = items.length;
  continueList.replaceChildren(...items.map(it => renderContinueCard(it)));
  syncContinueVisibility();
}

loadContinueRow();

// ---- VOD player --------------------------------------------------------
// sess is the single source of truth for the active VOD session.
//   id            — server session_id
//   url           — current playlist URL (changes on out-of-window seek)
//   startOffset   — media time (seconds) where the current playlist begins
//   duration      — full media duration (null for files ffprobe can't size)
//   ahead         — transcoded_ahead_s from /api/vod/status: how many seconds
//                   past startOffset are already on disk (the in-window range)
// Displayed position = startOffset + video.currentTime.
let sess = null;
let sessGen = 0;   // invalidates stale retries/polls after stop or re-start
let hls = null;
let statusTimer = null;
let scrubbing = false;
let seeking = false;  // an out-of-window /api/vod/seek round-trip in flight
let beaconDone = false;
let currentItem = null;   // item backing the active session (needed to restart it)
let preparing = false;    // waiting on ffmpeg to write the playlist
let nativeRetries = 0;    // native-HLS (iOS) reattach budget; Hls.js self-heals

const savedVol = parseFloat(localStorage.getItem("jetstream_volume"));
if (isFinite(savedVol) && savedVol >= 0 && savedVol <= 1) {
  video.volume = savedVol;
  volSlider.value = String(savedVol);
}

// iOS Safari: fullscreen goes through the webkit-prefixed video API.
const fsSupported = !!(video.webkitEnterFullscreen || playerWrap.requestFullscreen || video.requestFullscreen);
if (fsSupported) fsBtn.style.display = "";

function playWithFallback() {
  const p = video.play();
  if (p && typeof p.catch === "function") p.catch(() => {});
}

// A 4K HDR source can take a long time to produce its first segment, and a
// black box with "tap to play" on it reads as broken. Say what's happening.
function setPreparing(on) {
  preparing = on;
  playOverlay.textContent = on ? "preparing…" : "tap to play";
  playOverlay.classList.toggle("hidden", !on && (!video.paused || !sess));
  if (on) playOverlay.classList.remove("hidden");
}

function hardTeardown() {
  if (hls) { hls.destroy(); hls = null; }
}

// /api/vod/start returns as soon as ffmpeg is SPAWNED, not once it has
// written anything — so the playlist 404s for a while (~1.5 s on a small
// file, far longer for a 4K HDR source that has to decode + tonemap before
// the first segment). Attaching a player to a URL that isn't there yet is
// only survivable if something retries.
//
// Hls.js does (see the ERROR handler below), which is why this never showed
// up on desktop. iOS Safari takes the native branch, where a 404 is a plain
// media error with nothing watching for it — the player just sat dead on
// "tap to play" forever. Hence: wait for the playlist before attaching,
// whichever engine we're about to use.
const PLAYLIST_WAIT_MS = 120000;  // 4K HDR first-segment can be very slow
async function waitForPlaylist(url, gen) {
  const deadline = Date.now() + PLAYLIST_WAIT_MS;
  let delay = 200;
  for (;;) {
    if (gen !== sessGen) return false;         // superseded — abandon quietly
    try {
      const r = await fetch(url, { method: "HEAD", cache: "no-store" });
      if (r.ok) return true;
      if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return false; }
    } catch { /* network hiccup — treated the same as not-ready-yet */ }
    if (Date.now() > deadline) return false;
    await new Promise(r => setTimeout(r, delay));
    delay = Math.min(delay * 1.5, 2000);
  }
}

// Same engine-selection order as viewer.html: prefer native HLS where
// canPlayType says so (iOS Safari), else Hls.js, with fatal-error →
// destroy + re-create retry. No live-edge/sync logic — this is VOD.
async function attachPlayer(url) {
  const gen = sessGen;
  hardTeardown();
  setPreparing(true);
  const ready = await waitForPlaylist(url, gen);
  if (gen !== sessGen) return;                 // user moved on while we waited
  setPreparing(false);
  if (!ready) {
    toast("This one is taking too long to start — try again.");
    return;
  }
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.load();
  } else if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => playWithFallback());
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        hardTeardown();
        setTimeout(() => {
          if (sess && sessGen === gen) attachPlayer(sess.url);
        }, 800);
      }
    });
  } else {
    toast("HLS is not supported in this browser.");
    return;
  }
  playWithFallback();
  syncPlayUI();
}

function detachPlayer() {
  hardTeardown();
  video.removeAttribute("src");
  video.load();
}

// The one "sess.url changed, re-point the player at it" path. Every restart
// (out-of-window seek, subtitle switch, fresh start) funnels through here so
// there is a single teardown/attach/repaint sequence to reason about.
function reattachSession() {
  if (!sess) return;
  attachPlayer(sess.url);
  updateTimeUI();
  pollVodStatus();
}

// ---- Resume progress reporting -----------------------------------------
// Absolute position in the film (startOffset + element time) is what the
// server stores, so the resume point survives out-of-window seeks.
function progressBody() {
  if (!sess) return null;
  const pos = displayedPosition();
  if (!isFinite(pos) || pos <= 0) return null;
  return JSON.stringify({ session_id: sess.id, position: pos });
}

// Fire-and-forget; a failed report just means a slightly stale resume point.
function reportProgress() {
  const body = progressBody();
  if (!body) return;
  try {
    fetch("/api/vod/progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body,
      keepalive: true,
    }).catch(() => {});
  } catch {}
}

function beaconProgress() {
  const body = progressBody();
  if (!body) return;
  try {
    navigator.sendBeacon("/api/vod/progress",
      new Blob([body], { type: "application/json" }));
  } catch {}
}

video.addEventListener("pause", reportProgress);

// Politely end the current session server-side and reset local state.
async function stopVod() {
  reportProgress();   // last word on where the user got to
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
  const old = sess;
  sess = null;
  sessGen++;
  detachPlayer();
  if (old) {
    try {
      await fetch("/api/vod/stop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: old.id }),
      });
    } catch {}
  }
}

function showPlayerView(title) {
  playerTitle.textContent = title;
  document.title = title + " · jetstream";
  libraryView.hidden = true;
  playerView.hidden = false;
}

function showLibraryView() {
  hideSubtitleControl();
  currentItem = null;
  playerView.hidden = true;
  libraryView.hidden = false;
  document.title = "jetstream — library";
  // Whatever was just watched should be reflected in the row.
  loadContinueRow();
}

// forceRestart=true sends an explicit start:0, which overrides the server's
// automatic resume (used by the "Start over" toast action).
// startAt (seconds, absolute) is the subtitle-switch restart: an explicit
// start likewise wins over resume-from-progress, so the pause is invisible
// position-wise.
async function startVod(item, forceRestart, startAt) {
  const title = item.name || basename(item.path) || "(untitled)";
  // One session per user server-side — stop the old one first anyway.
  await stopVod();
  const gen = sessGen;
  currentItem = item;
  // A different file gets a clean subtitle slate; a restart of the same file
  // keeps the user's pick so the menu still reflects it afterwards.
  if (subInfoPath !== item.path) {
    subInfo = null;
    subInfoPath = null;
    subChoice = null;
  }
  hideSubtitleControl();
  showPlayerView(title);
  timeLabel.textContent = "Starting…";
  seekBar.disabled = true;
  seekBar.value = "0";
  try {
    // Omitting `start` lets the server resume from the saved position.
    const payload = { path: item.path };
    if (typeof startAt === "number" && isFinite(startAt)) payload.start = Math.max(0, startAt);
    else if (forceRestart) payload.start = 0;
    // Subtitles are burned in by ffmpeg — omitting the index means "off".
    if (subChoice !== null) payload.subtitle_idx = subChoice;
    const r = await fetch("/api/vod/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (gen !== sessGen) return;  // user already navigated away
    if (r.status === 409) {
      toast("All streams are busy — try again in a bit.");
      showLibraryView();
      return;
    }
    if (r.status === 404) {
      toast("That file isn't available any more.");
      showLibraryView();
      return;
    }
    if (r.status === 401) { location.href = "/login?next=%2Flibrary"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (gen !== sessGen) {
      // Session became orphaned mid-start — tell the server to reap it.
      try {
        navigator.sendBeacon("/api/vod/stop",
          new Blob([JSON.stringify({ session_id: j.session_id })], { type: "application/json" }));
      } catch {}
      return;
    }
    sess = {
      id: j.session_id,
      url: j.playlist_url,
      startOffset: j.start_offset || 0,
      duration: (typeof j.duration === "number" && isFinite(j.duration)) ? j.duration : null,
      ahead: null,
    };
    beaconDone = false;
    if (sess.duration) {
      seekBar.max = String(sess.duration);
      seekBar.disabled = false;
    } else {
      seekBar.disabled = true;
    }
    reattachSession();
    // Only the auto-resume (no explicit start) deserves the notice — a
    // subtitle switch or "Start over" already put us where we asked for.
    if (payload.start === undefined &&
        typeof j.resumed_from === "number" && isFinite(j.resumed_from) && j.resumed_from > 0) {
      toastWithAction(`Resuming from ${formatTime(j.resumed_from)}`, "Start over",
        () => startVod(item, true));
    }
    statusTimer = setInterval(pollVodStatus, 5000);
    loadSubtitleInfo(item.path);   // deliberately not awaited: ffprobe must not delay playback
  } catch {
    if (gen === sessGen) {
      toast("Couldn't start playback — try again.");
      showLibraryView();
    }
  }
}

document.getElementById("player-close").addEventListener("click", async () => {
  await stopVod();
  showLibraryView();
});

// ---- Status polling: grows the seekable window, detects ended/error ----
async function pollVodStatus() {
  if (!sess) return;
  const gen = sessGen;
  try {
    const r = await fetch("/api/vod/status?session_id=" + encodeURIComponent(sess.id));
    if (!r.ok || gen !== sessGen || !sess) return;
    const j = await r.json();
    if (gen !== sessGen || !sess) return;
    if (typeof j.transcoded_ahead_s === "number") sess.ahead = j.transcoded_ahead_s;
    if (typeof j.duration === "number" && isFinite(j.duration) && !sess.duration) {
      sess.duration = j.duration;
      seekBar.max = String(sess.duration);
      seekBar.disabled = false;
    }
    if (typeof j.start_offset === "number") sess.startOffset = j.start_offset;
    if (j.status === "ended") {
      // Transcode finished — the whole remainder is on disk. Playback keeps
      // going from the buffer; no more polling needed.
      if (sess.duration) sess.ahead = Math.max(0, sess.duration - sess.startOffset);
      if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
    } else if (j.status === "error") {
      toast("Playback error — try starting it again.");
      await stopVod();
      showLibraryView();
      return;
    }
    updateTimeUI();
    // Same ~5 s tick doubles as the resume-progress heartbeat.
    if (!video.paused && !seeking) reportProgress();
  } catch {}
}

// ---- Seek bar ----------------------------------------------------------
function displayedPosition() {
  return (sess ? sess.startOffset : 0) + (video.currentTime || 0);
}

function transcodedWindow() {
  // Seconds past startOffset that are safe to seek directly. Prefer the
  // server-reported transcode progress; fall back to what the element has
  // actually buffered before the first status poll lands.
  if (sess && typeof sess.ahead === "number") return sess.ahead;
  if (video.buffered.length) return video.buffered.end(video.buffered.length - 1);
  return 0;
}

function paintSeekBar(pos) {
  if (!sess || !sess.duration) return;
  const d = sess.duration;
  const played = Math.min(100, Math.max(0, (pos / d) * 100));
  const avail = Math.min(100, Math.max(played, ((sess.startOffset + transcodedWindow()) / d) * 100));
  seekBar.style.background =
    `linear-gradient(to right, var(--js-accent) 0%, var(--js-accent) ${played}%, ` +
    `rgba(223, 222, 221, 0.28) ${played}%, rgba(223, 222, 221, 0.28) ${avail}%, ` +
    `var(--js-surface-3) ${avail}%, var(--js-surface-3) 100%)`;
}

function updateTimeUI() {
  if (!sess) return;
  const pos = scrubbing ? parseFloat(seekBar.value) : displayedPosition();
  timeLabel.textContent = sess.duration
    ? `${formatTime(pos)} / ${formatTime(sess.duration)}`
    : formatTime(pos);
  if (!scrubbing && sess.duration) seekBar.value = String(pos);
  paintSeekBar(pos);
}

video.addEventListener("timeupdate", updateTimeUI);

seekBar.addEventListener("input", () => {
  scrubbing = true;
  updateTimeUI();
});

seekBar.addEventListener("change", async () => {
  scrubbing = false;
  if (!sess || seeking) return;
  const target = parseFloat(seekBar.value);
  if (!isFinite(target)) return;
  const rel = target - sess.startOffset;
  // Within the already-transcoded range → plain element seek. Keep a small
  // safety margin off the transcode edge so we don't land on a half-written
  // segment.
  if (rel >= 0 && rel <= Math.max(0, transcodedWindow() - 2)) {
    video.currentTime = rel;
    playWithFallback();
    return;
  }
  // Outside → ask the server to restart ffmpeg at the target; the returned
  // playlist_url carries a ?g= cache-buster, so tear down and attach fresh.
  seeking = true;
  const gen = sessGen;
  timeLabel.textContent = "Seeking…";
  try {
    const r = await fetch("/api/vod/seek", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sess.id, position: target }),
    });
    if (gen !== sessGen || !sess) return;
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (gen !== sessGen || !sess) return;
    sess.url = j.playlist_url;
    sess.startOffset = (typeof j.start_offset === "number") ? j.start_offset : target;
    sess.ahead = null;  // fresh transcode — window regrows from the next poll
    reattachSession();
  } catch {
    if (gen === sessGen) toast("Seek failed — try again.");
  } finally {
    seeking = false;
  }
});

// ---- Subtitles ---------------------------------------------------------
// Subtitles are burned into the video by ffmpeg, so there is no client-side
// track to toggle: changing them means restarting the transcode at the
// current position, exactly like an out-of-window seek. The UI says so.
let subInfo = null;      // normalised /api/user/library/subtitles payload
let subInfoPath = null;  // path subInfo describes (doubles as a 1-entry cache)
let subChoice = null;    // active subtitle stream index, null = off

function hideSubtitleMenu(refocus) {
  if (ccMenu.hidden) return;
  ccMenu.hidden = true;
  ccBtn.setAttribute("aria-expanded", "false");
  if (refocus) ccBtn.focus();
}

function hideSubtitleControl() {
  hideSubtitleMenu(false);
  ccWrap.classList.remove("available");
}

function subtitleTrackLabel(track) {
  return track.label || track.language || ("Track " + track.index);
}

function subtitleMenuItem(label, idx, isDefault) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("role", "menuitemradio");
  const active = subChoice === idx;
  btn.setAttribute("aria-checked", active ? "true" : "false");
  const tick = document.createElement("span");
  tick.className = "cc-tick";
  tick.setAttribute("aria-hidden", "true");
  tick.textContent = active ? "✓" : "";
  const text = document.createElement("span");
  text.className = "cc-label";
  text.textContent = label;
  if (isDefault) {
    const hint = document.createElement("span");
    hint.className = "cc-default";
    hint.textContent = "default";
    text.appendChild(hint);
  }
  btn.appendChild(tick);
  btn.appendChild(text);
  btn.addEventListener("click", () => chooseSubtitle(idx));
  return btn;
}

function renderSubtitleControl() {
  if (!sess || !subInfo || !subInfo.tracks.length) {
    hideSubtitleControl();
    return;
  }
  ccWrap.classList.add("available");
  if (!subInfo.enabled) {
    // Burn-in is off server-side: a chosen index would be ignored, so offer
    // no menu at all rather than a control that silently does nothing.
    hideSubtitleMenu(false);
    ccBtn.disabled = true;
    ccBtn.classList.remove("on");
    ccBtn.title = "Subtitles are switched off on the server";
    ccBtn.setAttribute("aria-label", "Subtitles unavailable — burn-in is switched off on the server");
    ccMenu.replaceChildren();
    return;
  }
  ccBtn.disabled = false;
  ccBtn.classList.toggle("on", subChoice !== null);
  ccBtn.title = "Subtitles";
  ccBtn.setAttribute("aria-label", "Subtitles");

  const nodes = [subtitleMenuItem("Off", null, false)];
  for (const track of subInfo.tracks) {
    nodes.push(subtitleMenuItem(subtitleTrackLabel(track), track.index,
      subInfo.defaultIndex === track.index));
  }
  const note = document.createElement("p");
  note.className = "cc-note";
  note.textContent = subInfo.firstPlayDelay
    ? "Subtitles are burned in — switching restarts the video at this spot. The first play of a track extracts it in the background."
    : "Subtitles are burned in — switching restarts the video at this spot.";
  nodes.push(note);
  ccMenu.replaceChildren(...nodes);
}

// Fired alongside/after the session start, never awaited by it: an ffprobe
// must not hold up playback.
async function loadSubtitleInfo(path) {
  if (!path) return;
  if (subInfoPath === path && subInfo) { renderSubtitleControl(); return; }
  const gen = sessGen;
  try {
    const r = await fetch("/api/user/library/subtitles?path=" + encodeURIComponent(path));
    if (!r.ok) return;
    const j = await r.json();
    if (gen !== sessGen || !sess) return;   // playback moved on while we probed
    subInfo = {
      tracks: Array.isArray(j.tracks) ? j.tracks : [],
      enabled: j.enabled !== false,
      defaultIndex: (typeof j.default_index === "number") ? j.default_index : null,
      firstPlayDelay: !!j.first_play_delay,
    };
    subInfoPath = path;
    renderSubtitleControl();
  } catch {}
}

async function chooseSubtitle(idx) {
  hideSubtitleMenu(true);
  if (idx === subChoice || !sess || !currentItem) return;
  const pos = displayedPosition();
  subChoice = idx;
  renderSubtitleControl();
  if (idx === null) {
    toast("Turning subtitles off — restarting from here…");
  } else if (subInfo && subInfo.firstPlayDelay) {
    toast("Switching subtitles… the first play of a track runs without them while it's extracted — play again to see them.");
  } else {
    toast("Switching subtitles…");
  }
  // Explicit start → the server's resume point can't override the position.
  await startVod(currentItem, false, isFinite(pos) ? pos : 0);
}

ccBtn.addEventListener("click", () => {
  if (ccBtn.disabled) return;
  if (!ccMenu.hidden) { hideSubtitleMenu(true); return; }
  ccMenu.hidden = false;
  ccBtn.setAttribute("aria-expanded", "true");
  const items = ccMenu.querySelectorAll("button");
  const checked = ccMenu.querySelector('button[aria-checked="true"]');
  const first = checked || items[0];
  if (first) first.focus();
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !ccMenu.hidden) hideSubtitleMenu(true);
});

document.addEventListener("click", ev => {
  if (!ccMenu.hidden && !ccWrap.contains(ev.target)) hideSubtitleMenu(false);
});

// A tab out of the menu (or any focus landing elsewhere) closes it too.
ccWrap.addEventListener("focusout", () => {
  setTimeout(() => {
    if (!ccMenu.hidden && !ccWrap.contains(document.activeElement)) hideSubtitleMenu(false);
  }, 0);
});

// ---- Play / pause / volume / fullscreen --------------------------------
function syncPlayUI() {
  playBtn.textContent = video.paused ? "▶" : "⏸";
  // While preparing, the overlay is showing "preparing…" and must stay up —
  // this runs on every timeupdate/pause and would otherwise hide it.
  playOverlay.classList.toggle("hidden", !preparing && (!video.paused || !sess));
  muteBtn.textContent = video.muted || video.volume === 0 ? "🔇" : "🔊";
  const shown = video.muted ? 0 : video.volume;
  if (parseFloat(volSlider.value) !== shown) volSlider.value = String(shown);
}

playBtn.addEventListener("click", () => {
  if (video.paused) playWithFallback();
  else video.pause();
});
playOverlay.addEventListener("click", () => {
  if (preparing) return;   // nothing to play yet; the wait will attach for us
  // A tap on the overlay is a real gesture — safe to unmute and play() here
  // (covers autoplay-policy rejections from the non-gesture start path).
  video.muted = false;
  if (video.volume === 0) video.volume = 1;
  video.play().catch(() => {});
  syncPlayUI();
});
video.addEventListener("click", () => {
  if (video.paused) playWithFallback();
  else video.pause();
});

// Frames are actually moving — the retry budget has done its job. Reset here
// rather than in attachPlayer: resetting on every *attach* would let a
// segment that always fails loop forever (attach → reset → error → attach…).
video.addEventListener("playing", () => { nativeRetries = 0; });

// Native-HLS recovery (iOS Safari). Hls.js has its own fatal-error retry; the
// native path had none at all, so any transient 404 — the playlist not written
// yet, or a segment the encoder hasn't reached — killed playback permanently
// with no way back except reloading the page. Bounded so a genuinely broken
// source doesn't spin forever.
video.addEventListener("error", () => {
  if (!sess || hls) return;                    // Hls.js handles its own errors
  if (preparing) return;                       // already waiting on the playlist
  if (nativeRetries >= 5) {
    toast("Playback failed — try again.");
    return;
  }
  nativeRetries++;
  const gen = sessGen;
  setTimeout(() => {
    if (sess && sessGen === gen) attachPlayer(sess.url);
  }, 1000 * nativeRetries);
});
muteBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) video.volume = 1;
  syncPlayUI();
});
volSlider.addEventListener("input", () => {
  const v = parseFloat(volSlider.value);
  video.volume = v;
  if (v > 0 && video.muted) video.muted = false;
  localStorage.setItem("jetstream_volume", String(v));
  syncPlayUI();
});
["play", "playing", "pause", "ended", "volumechange"].forEach(ev =>
  video.addEventListener(ev, syncPlayUI));
syncPlayUI();

fsBtn.addEventListener("click", () => {
  // webkit-first, mirroring viewer.html: iOS Safari 16.4+ ships a partial
  // div-level requestFullscreen that silently rejects on a video-bearing
  // <div>, so prefer webkitEnterFullscreen whenever it exists.
  if (typeof video.webkitEnterFullscreen === "function") {
    if (!video.webkitDisplayingFullscreen) video.webkitEnterFullscreen();
    return;
  }
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
    return;
  }
  const target = playerWrap.requestFullscreen ? playerWrap : video;
  const req = target.requestFullscreen;
  const p = req && req.call(target);
  if (p && typeof p.catch === "function") {
    p.catch(() => {
      if (target === playerWrap && typeof video.requestFullscreen === "function") {
        video.requestFullscreen().catch(() => {});
      }
    });
  }
});

// ---- Leave hygiene -----------------------------------------------------
// Best-effort stop so the server can reap the ffmpeg promptly instead of
// waiting for the idle reaper. sendBeacon survives page teardown; guard so
// pagehide + beforeunload firing back-to-back only sends once.
function beaconStop() {
  if (!sess || beaconDone) return;
  beaconDone = true;
  beaconProgress();   // save the resume point before the session goes away
  try {
    navigator.sendBeacon("/api/vod/stop",
      new Blob([JSON.stringify({ session_id: sess.id })], { type: "application/json" }));
  } catch {}
}
window.addEventListener("pagehide", beaconStop);
window.addEventListener("beforeunload", beaconStop);
</script>
</body>
