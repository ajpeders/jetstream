<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jetstream — admin</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0a0a0a;
    color: #e8e8e8;
    min-height: 100vh;
  }
  header {
    padding: 0.85rem 1.2rem;
    background: #111;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  header h1 { margin: 0; font-size: 1rem; font-weight: 500; }
  #status {
    flex: 1;
    color: #888;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status .live {
    display: inline-block;
    background: #c00;
    color: white;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    margin-right: 0.5rem;
    letter-spacing: 0.05em;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #333;
    padding: 0.4rem 0.9rem;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #333; }
  button.danger { background: #4a1818; border-color: #6a2424; }
  button.danger:hover { background: #5a1c1c; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #player { background: black; width: 100%; }
  #player video {
    display: block;
    width: 100%;
    max-height: 75vh;
    background: black;
    /* Hold the box at 16:9 so the pane never collapses to zero height when
       the stream is idle or being torn down. */
    aspect-ratio: 16 / 9;
    object-fit: contain;
  }
  #player-wrap { position: relative; background: black; }
  #unmute-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: rgba(0,0,0,0.4);
    color: white; font-size: 1rem; letter-spacing: 0.02em;
  }
  #unmute-overlay.hidden { display: none; }
  #vol-controls {
    position: absolute; bottom: 12px; right: 12px;
    display: flex; gap: 0.4rem;
    background: rgba(0,0,0,0.55);
    padding: 0.3rem 0.5rem; border-radius: 4px;
    align-items: center; opacity: 0.7; transition: opacity 0.15s;
  }
  #vol-controls:hover { opacity: 1; }
  #vol-controls button {
    background: transparent; border: none; color: white; cursor: pointer;
    font-size: 0.95rem; padding: 0.1rem 0.3rem;
  }
  #vol-controls input[type="range"] { width: 80px; accent-color: white; }
  #broadcast-bar #pause-btn {
    padding: 0.3rem 0.7rem; font-size: 0.85rem;
    min-width: 5em;
  }
  #friends-panel {
    padding: 1rem 1.2rem;
    background: #0e0e0e;
    border-bottom: 1px solid #1f1f1f;
  }
  #friends-panel h2 {
    margin: 0 0 0.7rem; font-size: 0.9rem; font-weight: 500; color: #ccc;
    letter-spacing: 0.02em;
  }
  #friends-panel form { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  #friends-panel input[type="text"] {
    flex: 1; max-width: 18em;
    background: #1a1a1a; color: #eee;
    border: 1px solid #333; border-radius: 3px;
    padding: 0.35rem 0.6rem; font-size: 0.85rem; font-family: inherit;
  }
  #friends-panel ul { list-style: none; padding: 0; margin: 0; }
  #friends-panel li {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.4rem 0; border-top: 1px solid #1a1a1a;
    font-size: 0.85rem;
  }
  #friends-panel li:first-child { border-top: none; }
  #friends-panel .label { flex: 1; color: #ccc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #friends-panel .url { color: #555; font-family: ui-monospace, monospace; font-size: 0.75rem; max-width: 22em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #friends-panel button { padding: 0.25rem 0.6rem; font-size: 0.75rem; }
  #url-panel {
    padding: 0.85rem 1.2rem;
    background: #0e0e0e;
    border-bottom: 1px solid #1f1f1f;
  }
  #url-panel h2 {
    margin: 0 0 0.6rem; font-size: 0.9rem; font-weight: 500; color: #ccc;
    letter-spacing: 0.02em;
  }
  #url-panel form { display: flex; gap: 0.4rem; }
  #url-panel input[type="url"] {
    flex: 1;
    background: #1a1a1a; color: #eee;
    border: 1px solid #333; border-radius: 3px;
    padding: 0.4rem 0.6rem; font-size: 0.85rem; font-family: inherit;
  }
  #url-panel .hint { color: #555; font-size: 0.75rem; margin-top: 0.4rem; }
  #queue-panel {
    padding: 0.85rem 1.2rem;
    background: #0e0e0e;
    border-bottom: 1px solid #1f1f1f;
  }
  #queue-panel .head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  #queue-panel h2 {
    margin: 0; font-size: 0.9rem; font-weight: 500; color: #ccc;
    letter-spacing: 0.02em; flex: 1;
  }
  #queue-panel .badge {
    background: #1a1a1a; color: #888;
    border: 1px solid #2a2a2a; border-radius: 3px;
    padding: 0.05rem 0.4rem; font-size: 0.75rem; font-variant-numeric: tabular-nums;
  }
  #queue-panel ul { list-style: none; padding: 0; margin: 0; }
  #queue-panel li {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0; border-top: 1px solid #1a1a1a;
    font-size: 0.85rem;
  }
  #queue-panel li:first-child { border-top: none; }
  #queue-panel .pos { color: #555; font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: right; }
  #queue-panel .qicon { color: #6cb6ff; width: 1.2em; text-align: center; }
  #queue-panel .qicon.url { color: #c66; }
  #queue-panel .qtitle { flex: 1; color: #ccc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue-panel button {
    padding: 0.2rem 0.5rem; font-size: 0.75rem;
  }
  #queue-panel .empty-q { color: #555; padding: 0.4rem 0; font-size: 0.85rem; }
  /* "Queue" button alongside file rows */
  ul#list li button.queue-btn {
    padding: 0.2rem 0.55rem; font-size: 0.75rem; flex-shrink: 0;
  }
  ul#list li.dir button.queue-btn { display: none; }
  #breadcrumb {
    padding: 0.7rem 1.2rem;
    background: #161616;
    font-size: 0.9rem;
    color: #777;
    border-bottom: 1px solid #1f1f1f;
    overflow-x: auto;
    white-space: nowrap;
  }
  #breadcrumb a { color: #6cb6ff; text-decoration: none; cursor: pointer; }
  #breadcrumb a:hover { text-decoration: underline; }
  #breadcrumb .sep { color: #444; padding: 0 0.4em; }
  ul#list { list-style: none; padding: 0; margin: 0; }
  ul#list li {
    padding: 0.85rem 1.2rem;
    border-bottom: 1px solid #1a1a1a;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  ul#list li:hover { background: #181818; }
  ul#list li.now { background: #1a2c1a; }
  ul#list li .icon { width: 1.4em; text-align: center; flex-shrink: 0; color: #888; }
  ul#list li.dir .icon { color: #6cb6ff; }
  ul#list li.now .icon { color: #6c6; }
  ul#list li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul#list li .meta { color: #666; font-size: 0.8rem; flex-shrink: 0; }
  .empty {
    padding: 2.5rem 1.2rem;
    text-align: center;
    color: #555;
    font-size: 0.9rem;
  }
  #toast {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #eee;
    padding: 0.7rem 1.1rem;
    border-radius: 4px;
    font-size: 0.85rem;
    border: 1px solid #333;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; }
  #broadcast-bar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 1.2rem;
    background: #0e0e0e;
    border-bottom: 1px solid #1f1f1f;
    font-size: 0.85rem;
  }
  #broadcast-bar #position { color: #6c6; font-variant-numeric: tabular-nums; }
  #broadcast-bar #duration { color: #888; font-variant-numeric: tabular-nums; }
  #broadcast-bar #broadcast-seek {
    flex: 1;
    accent-color: #c00;
  }
  #broadcast-bar #broadcast-seek:disabled { opacity: 0.4; }
  #seek-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    background: #111;
    border-bottom: 1px solid #1f1f1f;
    font-size: 0.85rem;
    color: #ccc;
    flex-wrap: wrap;
  }
  #seek-bar .sep { color: #555; }
  #seek-bar .spacer { flex: 1; }
  #seek-bar #position { font-variant-numeric: tabular-nums; color: #6c6; }
  #seek-bar #duration { font-variant-numeric: tabular-nums; color: #888; }
  #seek-bar button {
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
  }
  #seek-bar input {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
    width: 12em;
    font-family: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>jetstream <span style="color:#888;font-weight:400;font-size:0.85rem">/ admin</span></h1>
  <span id="status">idle</span>
  <span id="viewers" title="Active viewers" style="color:#888;font-size:0.85rem"></span>
  <button id="stop-btn" class="danger" style="display:none">Stop</button>
</header>
<div id="player">
  <div id="player-wrap">
    <video id="video" autoplay playsinline muted disablepictureinpicture
           controlslist="nodownload nofullscreen noremoteplayback noplaybackrate"></video>
    <div id="vol-controls">
      <button id="mute-btn" title="Mute / unmute">🔊</button>
      <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="1">
      <button id="fs-btn" title="Fullscreen">⛶</button>
    </div>
    <div id="unmute-overlay">tap to unmute</div>
  </div>
  <div id="broadcast-bar">
    <button id="pause-btn">Pause</button>
    <button id="skip-btn" title="Skip to next (queue, else random)" style="display:none">Skip ⏭</button>
    <span id="position">0:00:00</span>
    <input id="broadcast-seek" type="range" min="0" max="0" step="1" value="0" disabled>
    <span id="duration">--:--:--</span>
  </div>
  <div id="seek-bar">
    <button data-delta="-60">-1m</button>
    <button data-delta="-10">-10s</button>
    <button data-delta="10">+10s</button>
    <button data-delta="60">+1m</button>
    <button data-delta="600">+10m</button>
    <span class="spacer"></span>
    <input id="seek-input" type="text" placeholder="HH:MM:SS or seconds">
    <button id="seek-btn">Seek</button>
  </div>
</div>
<div id="friends-panel">
  <h2>Friends</h2>
  <label id="public-toggle-wrap" style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.7rem;font-size:0.85rem;color:#aaa;cursor:pointer">
    <input type="checkbox" id="public-toggle">
    <span>Public mode — anyone with the URL can watch (no invite token needed)</span>
  </label>
  <form id="friend-form">
    <input id="friend-name" type="text" placeholder="Friend's name" maxlength="40" required>
    <button type="submit">Generate link</button>
  </form>
  <ul id="tokens-list"></ul>
</div>
<div id="url-panel">
  <h2>Stream from URL</h2>
  <form id="url-form">
    <input id="url-input" type="url" placeholder="https://www.youtube.com/watch?v=…" required>
    <button type="submit" id="url-submit">Broadcast</button>
    <button type="button" id="url-queue">+ Queue</button>
  </form>
  <div class="hint">YouTube, Twitch, Vimeo, anything yt-dlp supports. Live streams won't be seekable.</div>
</div>
<div id="queue-panel">
  <div class="head">
    <h2>Up next</h2>
    <span class="badge" id="queue-count">0</span>
    <button id="queue-shuffle">Shuffle</button>
    <button id="queue-clear">Clear</button>
  </div>
  <ul id="queue-list"></ul>
</div>
<div id="viewers-panel" style="margin-top:1rem">
  <div class="head" style="display:flex;align-items:center;gap:0.5rem">
    <h2 style="margin:0">Viewers</h2>
    <span class="badge" id="viewers-count">0</span>
    <button id="viewers-history-btn" type="button">History</button>
  </div>
  <ul id="viewers-list" style="list-style:none;padding:0;margin:0.5rem 0 0;font-size:0.85rem"></ul>
  <div id="viewers-history" style="display:none;margin-top:0.6rem;max-height:18rem;overflow:auto;font-size:0.8rem;background:#111;padding:0.5rem;border-radius:4px"></div>
</div>
<div id="breadcrumb"></div>
<ul id="list"><li class="empty">Loading…</li></ul>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const ROOT = "";
const player = document.getElementById("player");
const video = document.getElementById("video");
const list = document.getElementById("list");
const breadcrumb = document.getElementById("breadcrumb");
const statusEl = document.getElementById("status");
const stopBtn = document.getElementById("stop-btn");
const pauseBtn = document.getElementById("pause-btn");
const skipBtn = document.getElementById("skip-btn");
const viewersEl = document.getElementById("viewers");
const toast = document.getElementById("toast");
const positionEl = document.getElementById("position");
const durationEl = document.getElementById("duration");
const seekInput = document.getElementById("seek-input");
const seekBtn = document.getElementById("seek-btn");
const broadcastSeek = document.getElementById("broadcast-seek");
const playerWrap = document.getElementById("player-wrap");
const unmuteOverlay = document.getElementById("unmute-overlay");
const muteBtn = document.getElementById("mute-btn");
const volSlider = document.getElementById("vol-slider");
const fsBtn = document.getElementById("fs-btn");
const friendsList = document.getElementById("tokens-list");
const friendForm = document.getElementById("friend-form");
const friendNameInput = document.getElementById("friend-name");
const urlForm = document.getElementById("url-form");
const urlInput = document.getElementById("url-input");
const urlSubmit = document.getElementById("url-submit");
const urlQueueBtn = document.getElementById("url-queue");
const queueList = document.getElementById("queue-list");
const queueCount = document.getElementById("queue-count");
const queueClearBtn = document.getElementById("queue-clear");
const queueShuffleBtn = document.getElementById("queue-shuffle");
const publicToggle = document.getElementById("public-toggle");

let currentDir = ROOT;
let nowPlaying = null;
let hls = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function formatSize(b) {
  if (typeof b !== "number" || b <= 0) return "";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b >= 100 || i === 0 ? 0 : 1) + " " + u[i];
}

function basename(p) { return p.split("/").pop(); }

function renderBreadcrumb() {
  const segs = currentDir ? currentDir.split("/").filter(Boolean) : [];
  const parts = [`<a data-path="">media</a>`];
  let acc = "";
  for (const seg of segs) {
    acc = acc ? acc + "/" + seg : seg;
    parts.push(`<span class="sep">/</span><a data-path="${escapeHtml(acc)}">${escapeHtml(seg)}</a>`);
  }
  breadcrumb.innerHTML = parts.join("");
  breadcrumb.querySelectorAll("a").forEach(a =>
    a.addEventListener("click", e => { e.preventDefault(); browse(a.dataset.path); })
  );
}

async function browse(path) {
  currentDir = path || "";
  renderBreadcrumb();
  list.innerHTML = '<li class="empty">Loading…</li>';
  try {
    const res = await fetch(`/admin/api/browse?path=${encodeURIComponent(currentDir)}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();
    renderItems(items);
  } catch (e) {
    list.innerHTML = `<li class="empty">Error: ${escapeHtml(e.message)}</li>`;
  }
}

function renderItems(items) {
  if (!items.length) {
    list.innerHTML = '<li class="empty">Empty</li>';
    return;
  }
  list.innerHTML = "";
  for (const item of items) {
    const isDir = item.type === "directory";
    const li = document.createElement("li");
    li.className = isDir ? "dir" : "file";
    if (!isDir && item.path === nowPlaying) li.classList.add("now");
    li.innerHTML = `
      <span class="icon">${isDir ? "▸" : (item.path === nowPlaying ? "●" : "▶")}</span>
      <span class="name"></span>
      <span class="meta">${isDir ? "" : escapeHtml(formatSize(item.size))}</span>
      ${isDir ? "" : '<button class="queue-btn" type="button">+ Queue</button>'}
    `;
    li.querySelector(".name").textContent = item.name;
    li.addEventListener("click", e => {
      if (e.target.closest(".queue-btn")) return;
      isDir ? browse(item.path) : play(item.path, item.name);
    });
    if (!isDir) {
      li.querySelector(".queue-btn").addEventListener("click", e => {
        e.stopPropagation();
        queueAddFile(item.path, item.name);
      });
    }
    list.appendChild(li);
  }
}

async function play(path, name) {
  if (!confirm(`Broadcast "${name}"? This replaces any current stream.`)) return;
  showToast("Starting stream…");
  try {
    const res = await fetch("/admin/api/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    nowPlaying = path;
    showToast("Stream starting — give it a few seconds");
  } catch (e) {
    showToast("Failed: " + e.message);
  }
}

async function stop() {
  if (!confirm("Stop the current stream?")) return;
  try {
    await fetch("/admin/api/stop", { method: "POST" });
    nowPlaying = null;
    teardownPlayer();
    showToast("Stopped");
  } catch (e) {
    showToast("Failed: " + e.message);
  }
}

stopBtn.addEventListener("click", stop);

let skipInFlight = false;
async function skipNext() {
  if (skipInFlight) return;
  skipInFlight = true;
  try {
    const res = await fetch("/admin/api/skip", { method: "POST" });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ("HTTP " + res.status));
    }
    showToast("Skipping…");
  } catch (e) {
    showToast("Failed: " + e.message);
  } finally {
    skipInFlight = false;
  }
}
skipBtn.addEventListener("click", skipNext);

let pauseInFlight = false;
async function togglePause(currentlyPaused) {
  if (pauseInFlight) return;
  pauseInFlight = true;
  try {
    const url = currentlyPaused ? "/admin/api/resume" : "/admin/api/pause";
    const res = await fetch(url, { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showToast(currentlyPaused ? "Resumed" : "Paused");
  } catch (e) {
    showToast("Failed: " + e.message);
  } finally {
    pauseInFlight = false;
  }
}
pauseBtn.addEventListener("click", () => togglePause(pauseBtn.dataset.paused === "1"));

function formatTime(s) {
  if (s == null || isNaN(s)) return "--:--:--";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function parseTime(s) {
  s = (s || "").trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const parts = s.split(":").map(p => parseFloat(p));
  if (parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0]*60 + parts[1];
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return null;
}

let pendingDelta = 0;
let seekTimer = null;
let seekInFlight = false;

function flushDelta() {
  seekTimer = null;
  if (seekInFlight || pendingDelta === 0) return;
  const delta = pendingDelta;
  pendingDelta = 0;
  seekInFlight = true;
  fetch("/admin/api/seek", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ delta_seconds: delta }),
  }).catch(e => showToast("Seek failed: " + e.message))
    .finally(() => {
      seekInFlight = false;
      if (pendingDelta !== 0) seekTimer = setTimeout(flushDelta, 600);
    });
}

function seekDelta(delta) {
  pendingDelta += delta;
  showToast(`${pendingDelta > 0 ? "+" : ""}${pendingDelta}s`);
  if (seekTimer) clearTimeout(seekTimer);
  seekTimer = setTimeout(flushDelta, 600);
}

async function seekTo(seconds) {
  if (seekInFlight) { showToast("Hold on…"); return; }
  seekInFlight = true;
  try {
    const res = await fetch("/admin/api/seek", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to_seconds: seconds }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showToast("Seeking to " + formatTime(seconds));
  } catch (e) {
    showToast("Seek failed: " + e.message);
  } finally {
    seekInFlight = false;
  }
}

document.querySelectorAll("#seek-bar button[data-delta]").forEach(b =>
  b.addEventListener("click", () => seekDelta(parseInt(b.dataset.delta, 10)))
);

seekBtn.addEventListener("click", () => {
  const t = parseTime(seekInput.value);
  if (t == null) { showToast("Bad time format"); return; }
  seekTo(t);
  seekInput.value = "";
});

seekInput.addEventListener("keydown", e => {
  if (e.key === "Enter") seekBtn.click();
});

let isScrubbing = false;
broadcastSeek.addEventListener("mousedown", () => { isScrubbing = true; });
broadcastSeek.addEventListener("touchstart", () => { isScrubbing = true; }, { passive: true });
broadcastSeek.addEventListener("input", () => {
  if (isScrubbing) positionEl.textContent = formatTime(parseFloat(broadcastSeek.value));
});
broadcastSeek.addEventListener("change", () => {
  const target = parseFloat(broadcastSeek.value);
  isScrubbing = false;
  seekTo(target);
});
broadcastSeek.addEventListener("keydown", e => {
  // Block arrow-key scrubbing (would fire many seeks); keep keyboard nav off this control.
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","PageUp","PageDown","Home","End"].includes(e.key)) {
    e.preventDefault();
  }
});

function setupPlayer() {
  if (hls) return;
  // Cache-buster forces iOS Safari (native HLS) to re-fetch the manifest on
  // stream restarts; without it, reusing the same URL is sometimes treated
  // as cached 404.
  const src = "/hls/stream.m3u8?_=" + Date.now();
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src;
    video.load();
    video.play().catch(() => {});
  } else if (window.Hls && Hls.isSupported()) {
    // liveSyncDurationCount: 1 keeps admin within ~one segment of live so it
    // matches viewer (and matches the loadedmetadata snap below).
    hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 1 });
    hls.loadSource(src);
    hls.attachMedia(video);
    // iOS Safari sometimes leaves the element paused after attachMedia
    // (especially mid-session after a soft-teardown). Explicit play() call
    // — promise rejection swallowed if autoplay is blocked.
    video.play().catch(() => {});
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        if (serverPaused) {
          try { hls.destroy(); } catch {}
          hls = null;
          lastReady = false;
          return;
        }
        // Transient stall — soft teardown, retry quickly. Last frame stays.
        softTeardown();
        setTimeout(setupPlayer, 800);
      }
    });
  } else {
    showToast("HLS not supported in this browser");
  }
  player.classList.remove("hidden");
}

function softTeardown() {
  // Drop the Hls.js instance only — leave the video element holding its
  // last frame. Used by the fatal-error recovery path so setupPlayer can
  // be called fresh on the retry tick.
  if (hls) { hls.destroy(); hls = null; }
}
function teardownPlayer() {
  // Used when the server is fully idle. Clears the source so the box can
  // sit dormant rather than holding a stale frame.
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute("src");
  video.load();
}

let lastReady = false;
let serverPaused = false;
async function pollStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    if (s.playing) {
      // No more per-source-change teardown: the server's composer keeps
      // /hls/stream.m3u8 live across seek / pause / resume / source-swap.
      // Each ffmpeg run writes into its own /hls/run/<id>/ subdir and the
      // master accumulates them with EXT-X-DISCONTINUITY between runs, so
      // the player keeps reading the same URL forever.
      nowPlaying = s.source_type === "file" ? s.path : null;
      const label = s.title || s.path || "";
      const liveLabel = s.paused
        ? '<span class="live" style="background:#888">PAUSED</span>'
        : (s.is_live ? '<span class="live">LIVE · URL</span>' : '<span class="live">LIVE</span>');
      statusEl.innerHTML = `${liveLabel}${escapeHtml(label)}`;
      stopBtn.style.display = "inline-block";
      pauseBtn.style.display = s.is_live ? "none" : "inline-block";
      skipBtn.style.display = "inline-block";
      pauseBtn.textContent = s.paused ? "Resume" : "Pause";
      pauseBtn.dataset.paused = s.paused ? "1" : "0";
      // Mirror pause state on the local admin player so the video freezes visually.
      serverPaused = !!s.paused;
      if (s.paused && !video.paused) video.pause();
      if (!s.paused && video.paused && !player.classList.contains("hidden")) {
        video.play().catch(() => {});
      }
      if (s.ready && !lastReady) setupPlayer();
      lastReady = s.ready;
    } else {
      serverPaused = false;
      nowPlaying = null;
      statusEl.textContent = "idle";
      stopBtn.style.display = "none";
      pauseBtn.style.display = "none";
      skipBtn.style.display = "none";
      if (lastReady) teardownPlayer();
      lastReady = false;
    }
    const v = s.viewers || 0;
    viewersEl.textContent = v ? `· ${v} viewer${v === 1 ? "" : "s"}` : "";
    if (s.playing) {
      if (!isScrubbing) {
        positionEl.textContent = formatTime(s.position_seconds);
        broadcastSeek.value = Math.floor(s.position_seconds || 0);
      }
      durationEl.textContent = s.is_live ? "LIVE" : formatTime(s.duration_seconds);
      broadcastSeek.max = Math.floor(s.duration_seconds || 0);
      broadcastSeek.disabled = !s.duration_seconds || s.is_live;
    } else {
      positionEl.textContent = "0:00:00";
      durationEl.textContent = "--:--:--";
      broadcastSeek.value = 0;
      broadcastSeek.max = 0;
      broadcastSeek.disabled = true;
    }
    // Refresh client/server clock offset so the sync interval can target
    // an absolute server moment instead of the device's local clock.
    if (typeof s.server_unix === "number") {
      serverClockOffsetMs = s.server_unix * 1000 - Date.now();
    }
  } catch (e) {}
}

// --- Custom video controls (mute / volume / fullscreen) ---
function syncMuteUI() {
  unmuteOverlay.classList.toggle("hidden", !video.muted);
  muteBtn.textContent = video.muted || video.volume === 0 ? "🔇" : "🔊";
  volSlider.value = video.muted ? 0 : video.volume;
}
unmuteOverlay.addEventListener("click", () => {
  video.muted = false;
  if (video.volume === 0) video.volume = 1;
  syncMuteUI();
});
muteBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) video.volume = 1;
  syncMuteUI();
});
volSlider.addEventListener("input", () => {
  video.volume = parseFloat(volSlider.value);
  video.muted = video.volume === 0;
  syncMuteUI();
});
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else playerWrap.requestFullscreen?.();
});
video.addEventListener("volumechange", syncMuteUI);
// iOS Safari can leave the element paused after a fatal-error recovery cycle
// without firing `pause`. `canplay` fires when the new buffer is ready —
// auto-resumes without user gesture or page refresh.
video.addEventListener("canplay", () => {
  if (!serverPaused && video.paused) video.play().catch(() => {});
});
syncMuteUI();

// Live-edge snap: on every fresh src/manifest load, jump to the live tail.
// Without this the player picks a position 1+ segments behind live, so refresh
// drops admin/viewer to ~4-8s lag and they stay there.
function snapToLive() {
  if (video.duration && isFinite(video.duration)) {
    try { video.currentTime = video.duration; } catch {}
  }
}
video.addEventListener("loadedmetadata", snapToLive);
// Continuous server-time sync — same logic as the viewer page. PDT-tagged
// segments + a periodic clock-offset update from /api/status mean every
// device targets the same wall-clock playhead.
const TARGET_LAG_S = 2.5;
let serverClockOffsetMs = 0;

function currentPlayingDateMs() {
  if (hls && hls.playingDate instanceof Date) return hls.playingDate.getTime();
  if (typeof video.getStartDate === "function") {
    const start = video.getStartDate();
    if (start && !isNaN(start.getTime())) return start.getTime() + video.currentTime * 1000;
  }
  return null;
}

// Continuous PDT-based sync. ±1.5% rate steering (preservesPitch=true keeps
// audio clean) holds devices within ~1s of each other. Hard snap on >5s drift.
try { video.preservesPitch = true; } catch {}
setInterval(() => {
  if (!video.duration || !isFinite(video.duration)) return;
  if (video.paused || serverPaused) return;
  const playing = currentPlayingDateMs();
  if (playing == null) {
    if (video.playbackRate !== 1.0) video.playbackRate = 1.0;
    return;
  }
  const serverNowMs = Date.now() + serverClockOffsetMs;
  const drift = (serverNowMs - playing) / 1000 - TARGET_LAG_S;
  if (Math.abs(drift) > 5) {
    snapToLive();
    video.playbackRate = 1.0;
    return;
  }
  let target = 1.0;
  if (drift > 0.5) target = 1.015;
  else if (drift < -0.5) target = 0.985;
  if (video.playbackRate !== target) video.playbackRate = target;
}, 2000);

// --- Friends / invite tokens ---
function tokenUrl(id) {
  return `${location.origin}/?t=${id}`;
}
function renderTokens(items) {
  if (!items.length) {
    friendsList.innerHTML = `<li><span class="label" style="color:#555">No invite links yet.</span></li>`;
    return;
  }
  friendsList.innerHTML = "";
  for (const t of items) {
    const li = document.createElement("li");
    const url = tokenUrl(t.id);
    li.innerHTML = `
      <span class="label"></span>
      <span class="url"></span>
      <button data-action="copy">Copy</button>
      <button data-action="revoke" class="danger">Revoke</button>
    `;
    li.querySelector(".label").textContent = t.label;
    const urlEl = li.querySelector(".url");
    urlEl.textContent = url;
    urlEl.title = url;
    li.querySelector('[data-action="copy"]').dataset.url = url;
    li.querySelector('[data-action="revoke"]').dataset.id = t.id;
    friendsList.appendChild(li);
  }
}
async function loadTokens() {
  try {
    const res = await fetch("/admin/api/tokens");
    if (!res.ok) throw new Error("HTTP " + res.status);
    renderTokens(await res.json());
  } catch (e) {
    friendsList.innerHTML = `<li><span class="label">Failed to load: ${escapeHtml(e.message)}</span></li>`;
  }
}
friendsList.addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "copy") {
    try { await navigator.clipboard.writeText(btn.dataset.url); showToast("Link copied"); }
    catch { showToast("Copy failed — select manually"); }
  } else if (action === "revoke") {
    if (!confirm("Revoke this invite link? Anyone using it gets locked out immediately.")) return;
    try {
      await fetch("/admin/api/tokens/" + encodeURIComponent(btn.dataset.id), { method: "DELETE" });
      showToast("Revoked");
      loadTokens();
    } catch (e) { showToast("Failed: " + e.message); }
  }
});
urlForm.addEventListener("submit", async e => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;
  if (!confirm(`Broadcast from URL?\n\n${url}\n\nThis may take a few seconds to start (yt-dlp resolving).`)) return;
  urlSubmit.disabled = true;
  urlSubmit.textContent = "Resolving…";
  showToast("Resolving with yt-dlp…");
  try {
    const res = await fetch("/admin/api/play_url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
    urlInput.value = "";
    const queuedNote = j.queued ? ` (+${j.queued} queued)` : "";
    showToast(`Streaming: ${j.title || "URL"}${j.is_live ? " (live)" : ""}${queuedNote}`);
    if (j.queued) loadQueue();
  } catch (e) {
    showToast("URL failed: " + e.message);
  } finally {
    urlSubmit.disabled = false;
    urlSubmit.textContent = "Broadcast";
  }
});

urlQueueBtn.addEventListener("click", async () => {
  const url = urlInput.value.trim();
  if (!url) { showToast("Paste a URL first"); return; }
  urlQueueBtn.disabled = true;
  urlQueueBtn.textContent = "…";
  try {
    const res = await fetch("/admin/api/queue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "url", url }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
    urlInput.value = "";
    const msg = j.added > 1
      ? `Queued ${j.added} videos from playlist`
      : `Queued: ${j.first_title || url}`;
    showToast(msg);
    loadQueue();
  } catch (e) {
    showToast("Queue failed: " + e.message);
  } finally {
    urlQueueBtn.disabled = false;
    urlQueueBtn.textContent = "+ Queue";
  }
});

async function queueAddFile(path, name) {
  try {
    const res = await fetch("/admin/api/queue", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "file", path }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
    showToast(`Queued: ${name} (#${j.queue_length})`);
    loadQueue();
  } catch (e) {
    showToast("Queue failed: " + e.message);
  }
}

function renderQueue(items) {
  queueCount.textContent = items.length;
  if (!items.length) {
    queueList.innerHTML = '<li class="empty-q">Queue is empty. Add a file or URL to auto-play after the current item ends.</li>';
    return;
  }
  queueList.innerHTML = "";
  items.forEach((it, i) => {
    const li = document.createElement("li");
    const isUrl = it.type === "url";
    li.innerHTML = `
      <span class="pos">${i + 1}.</span>
      <span class="qicon ${isUrl ? "url" : "file"}">${isUrl ? "🔗" : "▶"}</span>
      <span class="qtitle"></span>
      <button data-action="up"  data-i="${i}" ${i === 0 ? "disabled" : ""}>↑</button>
      <button data-action="dn"  data-i="${i}" ${i === items.length - 1 ? "disabled" : ""}>↓</button>
      <button data-action="rm"  data-i="${i}" class="danger">×</button>
    `;
    li.querySelector(".qtitle").textContent = it.title || it.ref;
    li.querySelector(".qtitle").title = it.ref;
    queueList.appendChild(li);
  });
}

async function loadQueue() {
  try {
    const res = await fetch("/admin/api/queue");
    if (!res.ok) throw new Error("HTTP " + res.status);
    renderQueue(await res.json());
  } catch (e) {
    queueList.innerHTML = `<li class="empty-q">Failed to load queue: ${escapeHtml(e.message)}</li>`;
  }
}

queueList.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const idx = parseInt(btn.dataset.i, 10);
  const action = btn.dataset.action;
  try {
    if (action === "rm") {
      await fetch(`/admin/api/queue/${idx}`, { method: "DELETE" });
    } else if (action === "up" || action === "dn") {
      await fetch(`/admin/api/queue/${idx}/move`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ direction: action === "up" ? "up" : "down" }),
      });
    }
    loadQueue();
  } catch (e) { showToast("Failed: " + e.message); }
});

queueClearBtn.addEventListener("click", async () => {
  if (!confirm("Clear the entire queue?")) return;
  try {
    await fetch("/admin/api/queue/clear", { method: "POST" });
    showToast("Queue cleared");
    loadQueue();
  } catch (e) { showToast("Failed: " + e.message); }
});

queueShuffleBtn.addEventListener("click", async () => {
  try {
    const res = await fetch("/admin/api/queue/shuffle", { method: "POST" });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
    showToast(`Shuffled ${j.queue_length} item${j.queue_length === 1 ? "" : "s"}`);
    loadQueue();
  } catch (e) { showToast("Shuffle failed: " + e.message); }
});

async function loadSettings() {
  try {
    const res = await fetch("/admin/api/settings");
    if (!res.ok) return;
    const s = await res.json();
    publicToggle.checked = !!s.viewer_public;
  } catch {}
}
publicToggle.addEventListener("change", async () => {
  const want = publicToggle.checked;
  try {
    const res = await fetch("/admin/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ viewer_public: want }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showToast(want ? "Public mode ON — anyone with the URL can watch" : "Invite-only mode");
  } catch (e) {
    publicToggle.checked = !want;  // revert
    showToast("Toggle failed: " + e.message);
  }
});

friendForm.addEventListener("submit", async e => {
  e.preventDefault();
  const label = friendNameInput.value.trim();
  if (!label) return;
  try {
    const res = await fetch("/admin/api/tokens", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const t = await res.json();
    friendNameInput.value = "";
    try {
      await navigator.clipboard.writeText(tokenUrl(t.id));
      showToast(`Link for ${label} copied`);
    } catch { showToast(`Link for ${label} ready`); }
    loadTokens();
  } catch (e) { showToast("Failed: " + e.message); }
});

// Kick the player up before the first /api/status round-trip so playback
// starts the instant the page renders.
setupPlayer();
pollStatus();
setInterval(pollStatus, 2500);
browse("");
loadTokens();
loadQueue();
setInterval(loadQueue, 5000);
loadSettings();

// --- Viewers panel ---
const viewersList = document.getElementById("viewers-list");
const viewersCount = document.getElementById("viewers-count");
const viewersHistoryBtn = document.getElementById("viewers-history-btn");
const viewersHistory = document.getElementById("viewers-history");

function fmtAgo(secs) {
  if (secs < 60) return Math.max(0, Math.floor(secs)) + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

async function refreshViewers() {
  try {
    const res = await fetch("/admin/api/viewers");
    if (!res.ok) return;
    const list = await res.json();
    viewersCount.textContent = list.length;
    if (list.length === 0) {
      viewersList.innerHTML = '<li style="color:#666;padding:0.4rem 0">no active viewers</li>';
      return;
    }
    const now = Date.now() / 1000;
    viewersList.innerHTML = list.map(v => `
      <li style="padding:0.3rem 0;border-bottom:1px solid #1a1a1a;display:flex;gap:0.5rem;align-items:baseline">
        <span style="color:#9c9;flex:0 0 9rem;font-family:monospace">${escapeHtml(v.ip)}</span>
        <span style="color:#aaa;flex:1">${escapeHtml(v.loc || "?")}</span>
        <span style="color:#666;font-size:0.75rem">${escapeHtml(fmtAgo(now - v.last_seen))}</span>
      </li>`).join("");
  } catch {}
}
setInterval(refreshViewers, 5000);
refreshViewers();

let historyVisible = false;
viewersHistoryBtn.addEventListener("click", async () => {
  historyVisible = !historyVisible;
  viewersHistory.style.display = historyVisible ? "block" : "none";
  viewersHistoryBtn.textContent = historyVisible ? "Hide history" : "History";
  if (!historyVisible) return;
  viewersHistory.textContent = "loading…";
  try {
    const res = await fetch("/admin/api/viewers/history");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      viewersHistory.innerHTML = '<div style="color:#666">no history yet</div>';
      return;
    }
    // Newest first.
    rows.reverse();
    viewersHistory.innerHTML = rows.map(r => {
      const t = new Date((r.ts || 0) * 1000).toLocaleString();
      const who = r.who || "anonymous";
      return `<div style="padding:0.18rem 0;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        <span style="color:#888">${escapeHtml(t)}</span>
        <span style="color:#9c9;margin-left:0.6rem">${escapeHtml(r.ip || "?")}</span>
        <span style="color:#aaa;margin-left:0.6rem">${escapeHtml(r.loc || "?")}</span>
        <span style="color:#ccc;margin-left:0.6rem">${escapeHtml(who)}</span>
      </div>`;
    }).join("");
  } catch (e) {
    viewersHistory.textContent = "Failed: " + e.message;
  }
});
</script>
