<script type="module" src="/build/admin.js"></script>
<script>
const ROOT = "";
// This page serves two roles from one file:
//   /admin    → host (Traefik basicauth). Full surface, API at /admin/api/*.
//   /controls → friend (cookie-gated). Playback + queue only, API at
//               /api/control/*; host-only panels (invites, settings, viewer
//               list) are hidden below.
const IS_ADMIN = !location.pathname.startsWith("/controls");
const API = IS_ADMIN ? "/admin/api" : "/api/control";
const player = document.getElementById("player");
const list = document.getElementById("list");
const breadcrumb = document.getElementById("breadcrumb");
const statusEl = document.getElementById("status");
const nowThumb = document.getElementById("now-thumb");
const nowThumbImg = document.getElementById("now-thumb-img");
let nowThumbPath = null;
function updateNowThumb(s) {
  // Mirror viewer.html: small header poster for FILE sources only. The
  // path-equality guard keeps the per-second pollStatus from re-fetching
  // the same image every tick.
  const path = s && s.source_type === "file" ? s.path : null;
  if (path === nowThumbPath) return;
  nowThumbPath = path;
  if (!path) {
    nowThumb.classList.remove("show");
    nowThumbImg.removeAttribute("src");
    return;
  }
  nowThumbImg.onload = () => nowThumb.classList.add("show");
  nowThumbImg.onerror = () => nowThumb.classList.remove("show");
  nowThumb.classList.remove("show");
  nowThumbImg.src = `/poster?path=${encodeURIComponent(path)}`;
}
const stopBtn = document.getElementById("stop-btn");
const pauseBtn = document.getElementById("pause-btn");
const skipBtn = document.getElementById("skip-btn");
const dockPauseBtn = document.getElementById("dock-pause");
const dockSkipBtn = document.getElementById("dock-skip");
const dockBackBtn = document.getElementById("dock-back");
const dockForwardBtn = document.getElementById("dock-forward");
const viewersEl = document.getElementById("viewers");
const toast = document.getElementById("toast");
const positionEl = document.getElementById("position");
const durationEl = document.getElementById("duration");
const seekInput = document.getElementById("seek-input");
const seekBtn = document.getElementById("seek-btn");
const broadcastSeek = document.getElementById("broadcast-seek");
const friendsList = document.getElementById("tokens-list");
const friendForm = document.getElementById("friend-form");
const friendNameInput = document.getElementById("friend-name");
const urlForm = document.getElementById("url-form");
const urlInput = document.getElementById("url-input");
const urlSubmit = document.getElementById("url-submit");
const urlQueueBtn = document.getElementById("url-queue");
const publicToggle = document.getElementById("public-toggle");
const streamQualitySelect = document.getElementById("stream-quality");

let currentDir = ROOT;
let nowPlaying = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}
window.jetstreamShowToast = showToast;

function formatSize(b) {
  if (typeof b !== "number" || b <= 0) return "";
  const u = ["B","KB","MB","GB","TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(b >= 100 || i === 0 ? 0 : 1) + " " + u[i];
}


function renderBreadcrumb() {
  const segs = currentDir ? currentDir.split("/").filter(Boolean) : [];
  const parts = [`<a data-path="">media</a>`];
  let acc = "";
  for (const seg of segs) {
    acc = acc ? acc + "/" + seg : seg;
    parts.push(`<span class="sep">/</span><a data-path="${escapeHtml(acc)}">${escapeHtml(seg)}</a>`);
  }
  breadcrumb.innerHTML = parts.join("");
  breadcrumb.querySelectorAll("a").forEach(a =>
    a.addEventListener("click", e => { e.preventDefault(); browse(a.dataset.path); })
  );
}

const showView = document.getElementById("show-view");

// "tv/Show Name" is depth 2 — one level under tv/. Anything deeper or in
// movies/ falls through to the regular grid renderer.
function isShowFolderPath(path) {
  if (!path) return false;
  const parts = path.split("/").filter(Boolean);
  return parts.length === 2 && parts[0].toLowerCase() === "tv";
}

async function browse(path) {
  currentDir = path || "";
  renderBreadcrumb();
  list.innerHTML = '<li class="empty">Loading…</li>';
  showView.style.display = "none";
  try {
    const res = await fetch(`${API}/browse?path=${encodeURIComponent(currentDir)}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();
    if (isShowFolderPath(currentDir)) {
      renderShow(currentDir, items);
    } else {
      renderItems(items);
    }
  } catch (e) {
    list.innerHTML = `<li class="empty">Error: ${escapeHtml(e.message)}</li>`;
  }
}

// ---- Library search ---------------------------------------------------
// Recursive filename search across the whole library, shown in the same list
// as browse. Available on /admin and /controls alike (both hit ${API}/search).
const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");
const searchInfo = document.getElementById("search-info");
let searchSeq = 0;

function exitSearch() {
  searchInfo.style.display = "none";
  searchClear.style.display = "none";
  breadcrumb.style.display = "";
  browse(currentDir);  // back to the folder we were in
}

async function doSearch(q) {
  const seq = ++searchSeq;
  searchClear.style.display = "";
  breadcrumb.style.display = "none";
  searchInfo.style.display = "";
  searchInfo.textContent = "Searching…";
  list.innerHTML = '<li class="empty">Searching…</li>';
  // Search always uses the flat grid view — hide any show-grouping carryover
  // from the folder the user was browsing before they typed in the search box.
  showView.style.display = "none";
  try {
    const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if (seq !== searchSeq) return;  // a newer keystroke superseded this
    const results = j.results || [];
    searchInfo.textContent = results.length
      ? `${results.length}${j.truncated ? "+" : ""} result${results.length === 1 ? "" : "s"} for “${q}”`
      : `No matches for “${q}”`;
    renderItems(results);
  } catch (e) {
    if (seq === searchSeq) list.innerHTML = `<li class="empty">Error: ${escapeHtml(e.message)}</li>`;
  }
}

let searchDebounce = null;
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim();
  clearTimeout(searchDebounce);
  if (!q) { exitSearch(); return; }
  searchDebounce = setTimeout(() => doSearch(q), 250);
});
searchClear.addEventListener("click", () => { searchInput.value = ""; exitSearch(); searchInput.focus(); });

function renderItems(items) {
  if (!items.length) {
    list.innerHTML = '<li class="empty">Empty</li>';
    return;
  }
  // Show the parent dir line only when searching — in normal browse the
  // breadcrumb already tells you which folder you're in, so a per-row repeat
  // is just noise. Detected by whether the search-info banner is visible.
  const inSearch = searchInfo.style.display !== "none";
  list.innerHTML = "";
  for (const item of items) {
    const isDir = item.type === "directory";
    const li = document.createElement("li");
    li.className = "card " + (isDir ? "dir" : "file");
    if (!isDir && item.path === nowPlaying) li.classList.add("now");
    li.innerHTML = `
      <div class="poster">
        <img loading="lazy" alt="">
        <span class="ph">${isDir ? "📁" : (item.path === nowPlaying ? "▶" : "🎬")}</span>
      </div>
      ${isDir ? '<span class="badge">FOLDER</span>' : (item.path === nowPlaying ? '<span class="badge">PLAYING</span>' : '')}
      ${isDir ? '' : '<button class="queue-btn" type="button">+ Queue</button>'}
      <div class="body">
        <div class="title"></div>
        <div class="parent"></div>
        <div class="meta">${isDir ? "" : escapeHtml(formatSize(item.size))}</div>
      </div>
    `;
    li.querySelector(".title").textContent = item.name;
    // Lazy-fetch the poster via /poster?path=. /poster returns 204 No Content
    // when the arr cache has no match; the `img.loaded` class is only added on
    // a successful load, so the emoji placeholder stays visible on misses.
    const img = li.querySelector(".poster img");
    img.addEventListener("load", () => img.classList.add("loaded"));
    img.src = `/poster?path=${encodeURIComponent(item.path)}`;
    // For files in search results, fish the parent directory out of the path
    // (e.g. "tv/It's Always Sunny in Philadelphia/Season 4/clue-sun401.avi"
    // → "tv/It's Always Sunny in Philadelphia/Season 4") so the user can tell
    // which show a mystery scene-rip filename belongs to.
    if (inSearch && !isDir && item.path && item.path.includes("/")) {
      li.querySelector(".parent").textContent =
        "↳ " + item.path.substring(0, item.path.lastIndexOf("/"));
    }
    li.addEventListener("click", e => {
      if (e.target.closest(".queue-btn")) return;
      isDir ? browse(item.path) : play(item.path, item.name);
    });
    if (!isDir) {
      li.querySelector(".queue-btn").addEventListener("click", e => {
        e.stopPropagation();
        queueAddFile(item.path, item.name);
      });
    }
    list.appendChild(li);
  }
}

// Map "S03E07" / "s03.e07" / "3x07" / "S03 E07" from a scene-rip filename.
// Returns {season, episode} or null when no pattern hits. Episodes that
// don't parse get bucketed into a "Specials" group so they're still visible.
const EP_PATTERNS = [
  /[Ss](\d{1,2})[._ -]*[Ee](\d{1,3})/,   // S01E07, s1.e7, s01-e07
  /(?:^|[^a-z0-9])(\d{1,2})x(\d{1,3})/i, // 3x07, 12x102
];
function parseEpisode(name) {
  for (const re of EP_PATTERNS) {
    const m = name.match(re);
    if (m) return { season: parseInt(m[1], 10), episode: parseInt(m[2], 10) };
  }
  return null;
}

// Pull a human episode title out of the filename when the source uses the
// Sonarr "{Series} - SxxExx - {Title}" pattern. Falls back to the bare
// filename minus the SxxExx code.
function extractEpisodeName(name, code) {
  // Strip extension once.
  const noExt = name.replace(/\.[^.]+$/, "");
  // Sonarr-shaped: "Show - S01E07 - Episode Title (Source)"
  const m = noExt.match(/[Ss]\d{1,2}[._ -]*[Ee]\d{1,3}[._ -]*[-_.][._ -]*(.+?)(?:[._ -]*\(.+?\))?$/);
  if (m && m[1] && m[1].trim() && !/^\d+p$/i.test(m[1].trim())) {
    // Clean separators back to spaces.
    return m[1].replace(/[._]/g, " ").trim();
  }
  // Otherwise show the bare filename, lightly cleaned of separators.
  return noExt.replace(/[._]/g, " ");
}

function renderShow(path, items) {
  // Show name is the last path component — what the user clicked into.
  const showName = path.split("/").filter(Boolean).pop() || "Show";
  // Group episodes by season number. "Specials" (S00 or no code) bucket
  // catches anything we can't parse so nothing is dropped on the floor.
  const seasons = new Map();
  const ungrouped = [];
  for (const item of items) {
    if (item.type === "directory") {
      // Some shows do have Season N/ subdirs after all — let the grid
      // handle those, fall through to renderItems.
      ungrouped.push(item);
      continue;
    }
    const parsed = parseEpisode(item.name);
    const seasonNum = parsed ? parsed.season : 0;
    if (!seasons.has(seasonNum)) seasons.set(seasonNum, []);
    seasons.get(seasonNum).push({
      ...item,
      episode: parsed ? parsed.episode : null,
      code: parsed ? `S${String(parsed.season).padStart(2, "0")}E${String(parsed.episode).padStart(2, "0")}` : "—",
      title: extractEpisodeName(item.name, parsed ? parsed.episode : null),
    });
  }
  // If no episodes parsed AND there are directories, fall back to grid view —
  // this folder is probably a "Show Name" wrapping "Season 1/" subdirs.
  if (seasons.size === 0 && ungrouped.length) {
    renderItems(items);
    return;
  }
  // Sort each season's episodes by episode number; sort seasons too.
  for (const eps of seasons.values()) {
    eps.sort((a, b) => (a.episode ?? 0) - (b.episode ?? 0));
  }
  const seasonNums = [...seasons.keys()].sort((a, b) => a - b);
  list.innerHTML = "";  // hide the grid; show-view takes over
  showView.style.display = "";
  // Banner: poster (from the arr cover map, looked up by the show folder) +
  // title + episode count. Same fade-on-load trick as the grid posters.
  const totalEps = [...seasons.values()].reduce((n, eps) => n + eps.length, 0);
  showView.innerHTML = `
    <div class="banner">
      <div class="poster">
        <img loading="lazy" alt="">
        <span class="ph">📺</span>
      </div>
      <div class="meta">
        <h2 class="title"></h2>
        <div class="count">${seasonNums.length} season${seasonNums.length === 1 ? "" : "s"} · ${totalEps} episode${totalEps === 1 ? "" : "s"}</div>
      </div>
    </div>
  `;
  showView.querySelector(".banner .title").textContent = showName;
  const bannerImg = showView.querySelector(".banner .poster img");
  bannerImg.addEventListener("load", () => bannerImg.classList.add("loaded"));
  bannerImg.src = `/poster?path=${encodeURIComponent(path)}`;
  // One block per season. localStorage remembers which seasons the user has
  // collapsed so the view doesn't reset between visits — keyed by show name
  // so collapsing Season 1 of IASIP doesn't also collapse it of Curb.
  const collapsedKey = `jetstream_seasons_collapsed_${showName}`;
  const collapsedSet = new Set(
    (localStorage.getItem(collapsedKey) || "").split(",").filter(Boolean).map(Number),
  );
  for (const n of seasonNums) {
    const eps = seasons.get(n);
    const block = document.createElement("div");
    block.className = "season";
    if (collapsedSet.has(n)) block.classList.add("collapsed");
    block.innerHTML = `
      <div class="season-head">
        <span class="toggle">▾</span>
        <h3>${n === 0 ? "Specials" : "Season " + n}</h3>
        <span class="count">${eps.length} ep${eps.length === 1 ? "" : "s"}</span>
      </div>
      <ul class="episodes"></ul>
    `;
    const ul = block.querySelector(".episodes");
    for (const e of eps) {
      const li = document.createElement("li");
      if (e.path === nowPlaying) li.classList.add("now");
      li.innerHTML = `
        <span class="ep-code"></span>
        <span class="ep-name"></span>
        <span class="ep-meta"></span>
        <button class="queue-btn" type="button">+ Queue</button>
      `;
      li.querySelector(".ep-code").textContent = e.code;
      li.querySelector(".ep-name").textContent = e.title;
      li.querySelector(".ep-meta").textContent = formatSize(e.size);
      li.addEventListener("click", evt => {
        if (evt.target.closest(".queue-btn")) return;
        play(e.path, e.name);
      });
      li.querySelector(".queue-btn").addEventListener("click", evt => {
        evt.stopPropagation();
        queueAddFile(e.path, e.name);
      });
      ul.appendChild(li);
    }
    // Toggle handler — flip the collapsed state and persist.
    block.querySelector(".season-head").addEventListener("click", () => {
      const nowCollapsed = block.classList.toggle("collapsed");
      if (nowCollapsed) collapsedSet.add(n);
      else collapsedSet.delete(n);
      localStorage.setItem(collapsedKey, [...collapsedSet].join(","));
    });
    showView.appendChild(block);
  }
}

async function play(path, name) {
  if (!confirm(`Broadcast "${name}"? This replaces any current stream.`)) return;
  showToast("Starting stream…");
  try {
    const res = await fetch(`${API}/play`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    nowPlaying = path;
    showToast("Stream starting — give it a few seconds");
  } catch (e) {
    showToast("Failed: " + e.message);
  }
}

async function stop() {
  if (!confirm("Stop the current stream?")) return;
  // Optimistic UI: tear the player down immediately so the admin sees the
  // stop reflected on the click, not after the next poll. The server call
  // catches up async — pollStatus reconciles either way.
  nowPlaying = null;
  showToast("Stopping…");
  try {
    await fetch(`${API}/stop`, { method: "POST" });
  } catch (e) {
    showToast("Failed: " + e.message);
  }
}

stopBtn.addEventListener("click", stop);

let skipInFlight = false;
async function skipNext() {
  if (skipInFlight) return;
  skipInFlight = true;
  // Optimistic disable — the button visually commits before the network
  // round-trip. pollStatus updates the title once the new source is up.
  skipBtn.disabled = true;
  showToast("Skipping…");
  try {
    const res = await fetch(`${API}/skip`, { method: "POST" });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ("HTTP " + res.status));
    }
  } catch (e) {
    showToast("Failed: " + e.message);
  } finally {
    skipInFlight = false;
    skipBtn.disabled = false;
  }
}
skipBtn.addEventListener("click", skipNext);
dockSkipBtn.addEventListener("click", skipNext);

let pauseInFlight = false;
async function togglePause(currentlyPaused) {
  if (pauseInFlight) return;
  pauseInFlight = true;
  // Optimistic flip — the button label + dataset change instantly so admin
  // doesn't see "Pause" stay "Pause" until the next /api/status poll. The
  // poll reconciles if the server rejected the toggle (unlikely, basically
  // only happens on double-click races, which the in-flight guard absorbs).
  const willBePaused = !currentlyPaused;
  pauseBtn.textContent = willBePaused ? "Resume" : "Pause";
  pauseBtn.dataset.paused = willBePaused ? "1" : "0";

  try {

    const res = await fetch(url, { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showToast(currentlyPaused ? "Resumed" : "Paused");
  } catch (e) {
    showToast("Failed: " + e.message);
  } finally {
    pauseInFlight = false;
  }
}

// Relative-time label shared by the VOD sessions table and the users panel.
// Lived in the Viewers panel until that moved to Angular; it is plain enough
// to keep here rather than reach into the bundle for it.
function fmtAgo(secs) {
  if (secs < 60) return Math.max(0, Math.floor(secs)) + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  return Math.floor(secs / 86400) + "d ago";
}

function formatTime(s) {
  if (s == null || isNaN(s)) return "--:--:--";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

function parseTime(s) {
  s = (s || "").trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const parts = s.split(":").map(p => parseFloat(p));
  if (parts.some(isNaN)) return null;
  if (parts.length === 2) return parts[0]*60 + parts[1];
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return null;
}

let pendingDelta = 0;
let seekTimer = null;
let seekInFlight = false;

function flushDelta() {
  seekTimer = null;
  if (seekInFlight || pendingDelta === 0) return;
  const delta = pendingDelta;
  pendingDelta = 0;
  seekInFlight = true;
  fetch(`${API}/seek`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ delta_seconds: delta }),
  }).catch(e => showToast("Seek failed: " + e.message))
    .finally(() => {
      seekInFlight = false;
      if (pendingDelta !== 0) seekTimer = setTimeout(flushDelta, 600);
    });
}

function seekDelta(delta) {
  pendingDelta += delta;
  showToast(`${pendingDelta > 0 ? "+" : ""}${pendingDelta}s`);
  if (seekTimer) clearTimeout(seekTimer);
  seekTimer = setTimeout(flushDelta, 600);
}

async function seekTo(seconds) {
  if (seekInFlight) { showToast("Hold on…"); return; }
  seekInFlight = true;
  try {
    const res = await fetch(`${API}/seek`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to_seconds: seconds }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    showToast("Seeking to " + formatTime(seconds));
  } catch (e) {
    showToast("Seek failed: " + e.message);
  } finally {
    seekInFlight = false;
  }
}

document.querySelectorAll("#seek-bar button[data-delta]").forEach(b =>
  b.addEventListener("click", () => seekDelta(parseInt(b.dataset.delta, 10)))
);

let isScrubbing = false;
broadcastSeek.addEventListener("mousedown", () => { isScrubbing = true; });

broadcastSeek.addEventListener("input", () => {

});

// --- Subtitles (burned-in) ------------------------------------------------
// Subtitles here are NOT a per-viewer preference: the server burns the chosen
// track into the shared encode, so switching restarts ffmpeg at the current
// position and every viewer sees a ~2s blip. The UI says so out loud — a
// silent toggle would look broken (or rude) otherwise.
//
// State is refreshed off the existing pollStatus tick (see the call in
// pollStatus below) — no second timer. Probing costs more than /api/status,
// so it re-fetches on source change, after a switch, and otherwise every few
// ticks rather than every second.
const subsControl = document.getElementById("subs-control");
const subsBtn = document.getElementById("subs-btn");
const subsMenu = document.getElementById("subs-menu");
const subsNotice = document.getElementById("subs-notice");

let subsState = null;        // last good GET payload, or null when unavailable
let subsSourceKey = null;    // identity of the source the state belongs to
let subsFetchInFlight = false;
let subsForceRefresh = true; // fetch on the very first tick
let subsTick = 0;
let subsPostInFlight = false;

function subsHide() {
  subsState = null;
  subsControl.style.display = "none";
  subsCloseMenu();
}

function subsTrackLabel(idx) {
  if (!subsState || idx == null) return "Off";
  const t = (subsState.tracks || []).find(x => x.index === idx);
  if (!t) return "Track " + idx;
  return t.label || t.language || ("Track " + idx);
}

function subsRenderButton() {
  if (!subsState) return;
  subsBtn.textContent = "Subtitles: " + subsTrackLabel(subsState.current);
  const disabled = subsState.enabled === false;
  subsBtn.disabled = disabled;
  subsBtn.title = disabled
    ? "Subtitle burn-in is switched off on the server"
    : "Burned-in subtitles — switching affects everyone watching and blips the stream ~2s";
  if (disabled) subsCloseMenu();
}

function subsCloseMenu() {
  subsMenu.hidden = true;
  subsMenu.replaceChildren();
  subsBtn.setAttribute("aria-expanded", "false");
}

function subsOpenMenu() {
  if (!subsState || subsState.enabled === false) return;
  subsMenu.replaceChildren();
  const entries = [{ index: null, label: "Off" }].concat(
    (subsState.tracks || []).map(t => ({
      index: t.index,
      label: t.label || t.language || ("Track " + t.index),
    }))
  );
  for (const e of entries) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitemradio");
    const active = subsState.current === e.index || (e.index === null && subsState.current == null);
    b.setAttribute("aria-checked", active ? "true" : "false");
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = active ? "✓" : "";
    tick.setAttribute("aria-hidden", "true");
    const name = document.createElement("span");
    name.textContent = e.label;          // server string — textContent only
    b.append(tick, name);
    b.addEventListener("click", () => { subsCloseMenu(); subsChoose(e.index); });
    subsMenu.appendChild(b);
  }
  if (subsState.first_play_delay) {
    const note = document.createElement("div");
    note.className = "subs-note";
    note.textContent = "First use of a track plays without subtitles while it's extracted in the background — pick it again after a moment.";
    subsMenu.appendChild(note);
  }
  subsMenu.hidden = false;
  subsBtn.setAttribute("aria-expanded", "true");
  const first = subsMenu.querySelector("button");
  if (first) first.focus();
}

function subsSetNotice(text) {
  subsNotice.textContent = text;
  clearTimeout(subsSetNotice._t);
  if (text) subsSetNotice._t = setTimeout(() => { subsNotice.textContent = ""; }, 9000);
}

async function subsChoose(idx) {
  if (subsPostInFlight) return;
  subsPostInFlight = true;
  // Optimistic label; the poll below reconciles from the server.
  if (subsState) { subsState.current = idx; subsRenderButton(); }
  try {
    const res = await fetch(`${API}/subtitles`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subtitle_idx: idx }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 409 && data.error === "burn_in_disabled") {
        subsSetNotice(data.message || "Subtitle burn-in is switched off on the server.");
        showToast("Burn-in disabled");
      } else if (res.status === 400 && data.error === "bad_track") {
        subsSetNotice("That subtitle track is no longer available — the list has been refreshed.");
        showToast("Unknown track");
      } else {
        const msg = data.error || ("HTTP " + res.status);
        subsSetNotice("Subtitle switch failed: " + msg);
        showToast("Subtitles failed: " + msg);
      }
      subsForceRefresh = true;
      return;
    }
    showToast(idx == null ? "Subtitles off" : "Subtitles: " + subsTrackLabel(idx));
    let notice = "Restarting the encode at the current position — everyone watching gets a ~2 second blip, and this changes subtitles for all viewers, not just you.";
    if (idx != null && subsState && subsState.first_play_delay) {
      notice += " First time on a track it plays without subtitles while it's extracted; pick it again in a minute to get them.";
    }
    subsSetNotice(notice);
  } catch (e) {
    subsSetNotice("Subtitle switch failed: " + e.message);
    showToast("Subtitles failed: " + e.message);
    subsForceRefresh = true;
  } finally {
    subsPostInFlight = false;
    subsForceRefresh = true;
  }
}

async function subsRefresh(status) {
  // Called once per pollStatus tick. Bails cheaply when nothing can change.
  if (!status || !status.playing) { subsSourceKey = null; subsHide(); return; }
  const key = status.path || status.url || status.title || "playing";
  if (key !== subsSourceKey) { subsSourceKey = key; subsForceRefresh = true; }
  subsTick++;
  if (!subsForceRefresh && subsTick % 5 !== 0) return;
  if (subsFetchInFlight || subsPostInFlight) return;
  subsFetchInFlight = true;
  subsForceRefresh = false;
  try {
    const res = await fetch(`${API}/subtitles`);
    const data = await res.json().catch(() => ({}));
    // No stream / not a file source / source unavailable → nothing to offer.
    if (!res.ok || !Array.isArray(data.tracks) || data.tracks.length === 0) {
      subsHide();
      return;
    }
    subsState = data;
    subsControl.style.display = "block";
    subsRenderButton();
  } catch (e) {
    subsHide();
  } finally {
    subsFetchInFlight = false;
  }
}

subsBtn.addEventListener("click", () => {
  if (subsMenu.hidden) subsOpenMenu(); else subsCloseMenu();
});
subsControl.addEventListener("keydown", e => {
  if (e.key === "Escape" && !subsMenu.hidden) {
    e.stopPropagation();
    subsCloseMenu();
    subsBtn.focus();
    return;
  }
  if (subsMenu.hidden) return;
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = Array.from(subsMenu.querySelectorAll("button"));
  if (!items.length) return;
  const i = items.indexOf(document.activeElement);
  const next = e.key === "ArrowDown"
    ? (i < 0 ? 0 : (i + 1) % items.length)
    : (i <= 0 ? items.length - 1 : i - 1);
  items[next].focus();
});
document.addEventListener("click", e => {
  if (!subsMenu.hidden && !subsControl.contains(e.target)) subsCloseMenu();
});
document.addEventListener("focusin", e => {
  if (!subsMenu.hidden && !subsControl.contains(e.target)) subsCloseMenu();
});

// Admin has no inline video preview — broadcast was removed in favour of
// just controlling the stream (admin opens a viewer tab to actually watch).
// Keep serverPaused state for control-button enable/disable logic.
let serverPaused = false;
async function pollStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    if (s.playing) {
      // No more per-source-change teardown: the server's composer keeps
      // /hls/stream.m3u8 live across seek / pause / resume / source-swap.
      // Each ffmpeg run writes into its own /hls/run/<id>/ subdir and the
      // master accumulates them with EXT-X-DISCONTINUITY between runs, so
      // the player keeps reading the same URL forever.
      nowPlaying = s.source_type === "file" ? s.path : null;
      const label = s.title || s.path || "";
      const liveLabel = s.paused
        ? '<span class="live" style="background:#888">PAUSED</span>'
        : (s.is_live ? '<span class="live">LIVE · URL</span>' : '<span class="live">LIVE</span>');
      statusEl.innerHTML = `${liveLabel}${escapeHtml(label)}`;
      updateNowThumb(s);
      stopBtn.style.display = "inline-block";
      pauseBtn.style.display = s.is_live ? "none" : "inline-block";
      skipBtn.style.display = "inline-block";
      pauseBtn.textContent = s.paused ? "Resume" : "Pause";
      pauseBtn.dataset.paused = s.paused ? "1" : "0";
      dockPauseBtn.textContent = s.paused ? "Resume" : "Pause";
      dockPauseBtn.dataset.paused = s.paused ? "1" : "0";
      dockPauseBtn.disabled = !!s.is_live;
      dockSkipBtn.disabled = false;
      dockBackBtn.disabled = !!s.is_live;
      dockForwardBtn.disabled = !!s.is_live;
      serverPaused = !!s.paused;
    } else {
      serverPaused = false;
      nowPlaying = null;
      statusEl.textContent = "idle";
      updateNowThumb(null);
      stopBtn.style.display = "none";
      pauseBtn.style.display = "none";
      skipBtn.style.display = "none";
      dockPauseBtn.textContent = "Pause";
      dockPauseBtn.dataset.paused = "0";
      dockPauseBtn.disabled = true;
      dockSkipBtn.disabled = true;
      dockBackBtn.disabled = true;
      dockForwardBtn.disabled = true;
    }
    const v = s.viewers || 0;
    viewersEl.textContent = v ? `· ${v} viewer${v === 1 ? "" : "s"}` : "";
    if (s.playing) {
      if (!isScrubbing) {
        positionEl.textContent = formatTime(s.position_seconds);
        broadcastSeek.value = Math.floor(s.position_seconds || 0);
      }
      durationEl.textContent = s.is_live ? "LIVE" : formatTime(s.duration_seconds);
      broadcastSeek.max = Math.floor(s.duration_seconds || 0);
      broadcastSeek.disabled = !s.duration_seconds || s.is_live;
    } else {
      positionEl.textContent = "0:00:00";
      durationEl.textContent = "--:--:--";
      broadcastSeek.value = 0;
      broadcastSeek.max = 0;
      broadcastSeek.disabled = true;
    }
    // Refresh client/server clock offset so the sync interval can target
    // an absolute server moment instead of the device's local clock.
    if (typeof s.server_unix === "number") {
      serverClockOffsetMs = s.server_unix * 1000 - Date.now();
    }
    // Piggyback the subtitle state on this tick — no second timer.
    subsRefresh(s);
  } catch (e) {}
}

// controls to wire, no PDT-based drift loop, no live-edge snap. Admin
// just controls the broadcast; viewing happens in a viewer tab.
let serverClockOffsetMs = 0;

function tokenUrl(id) {
  return `${location.origin}/?t=${id}`;
}
function renderTokens(items) {
  if (!items.length) {
    friendsList.innerHTML = `<li><span class="label" style="color:#555">No invite links yet.</span></li>`;
    return;
  }
  friendsList.innerHTML = "";
  for (const t of items) {
    const li = document.createElement("li");
    const url = tokenUrl(t.id);
    const isFriend = t.level === "friend";
    li.innerHTML = `
      <span class="label"></span>
      <span class="tlevel" style="flex-shrink:0;font-size:0.65rem;letter-spacing:0.04em;font-weight:600;padding:0.08rem 0.4rem;border-radius:3px;${isFriend ? 'background:#1f3326;color:#7dcc99;border:1px solid #2c4a37' : 'background:#383632;color:#dfdedd;border:1px solid #494641'}"></span>
      <span class="url"></span>
      <button data-action="copy">Copy</button>
      <button data-action="revoke" class="danger">Revoke</button>
    `;
    li.querySelector(".label").textContent = t.label;
    li.querySelector(".tlevel").textContent = isFriend ? "CONTROL" : "VIEW";
    const urlEl = li.querySelector(".url");
    urlEl.textContent = url;
    urlEl.title = url;
    li.querySelector('[data-action="copy"]').dataset.url = url;
    li.querySelector('[data-action="revoke"]').dataset.id = t.id;
    friendsList.appendChild(li);
  }
}
async function loadTokens() {
  try {
    const res = await fetch("/admin/api/tokens");
    if (!res.ok) throw new Error("HTTP " + res.status);
    renderTokens(await res.json());

    friendsList.innerHTML = `<li><span class="label">Failed to load: ${escapeHtml(e.message)}</span></li>`;
  }
}
friendsList.addEventListener("click", async e => {

  for (const id of ["friends-panel", "stream-settings-panel", "viewers-panel", "requests-panel", "media-requests-panel", "reports-panel", "reactions-panel", "users-panel", "vod-panel"]) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }
  document.title = "jetstream — controls";
  const sub = document.querySelector("header h1 span");
  if (sub) sub.textContent = "/ controls";
}

// No inline player to kick — go straight to status polling.
pollStatus();
// 1s poll on admin — controls feel responsive when state propagates within
// a tick of clicking. /api/status is ~1ms server-side; gunicorn handles it
// with thread to spare.
setInterval(pollStatus, 1000);
browse("");
loadQueue();
setInterval(loadQueue, 5000);
// Host-only panels (invites, public-mode toggle, viewer list) only exist on
// the /admin surface. On /controls they're hidden and their pollers skipped.
if (IS_ADMIN) {
  loadTokens();
  loadSettings();
}

</script>
</body>
</html>
