name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run from the Actions UI / API (e.g. after a transient failure
  # caused by host load, which is exactly how run 28's tests job died).
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Backend: byte-compile every python file — catches syntax errors and
      # obvious breakage without needing the full ffmpeg/nvidia runtime.
      - name: python compile check
        run: python3 -m compileall -q app.py bin tests
      # Frontend: the React/Vite bundle must build; static/build is what the
      # container serves, so a broken build = broken admin/chat UI.
      - name: npm build
        run: |
          npm ci
          npm run build

  # Lint + auth smoke tests in the runtime's python (the checks job runs in
  # node:20, whose python3 is 3.11 — fine for compileall, wrong for testing).
  # python:3.12 has no node, so actions/checkout can't run in it — manual
  # token clone instead (same reasoning as the kaniko job's git context).
  tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    steps:
      - name: checkout (manual — no node in this container)
        run: |
          git clone -q "http://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" src
          cd src && git checkout -q "${{ github.sha }}"
      - name: ruff + smoke tests
        run: |
          cd src
          pip install -q flask==3.0.3 werkzeug==3.1.8 pytest ruff
          # E9/F63/F7/F82: syntax errors + undefined names — real-bug rules
          # only, so the 6.8k-line app.py doesn't need a style pass first.
          ruff check --select E9,F63,F7,F82 .
          pytest -q tests/

  # The checks above run against a full checkout, so they cannot see Dockerfile
  # faults — a missing apt package, or a COPY that doesn't bring in a file the
  # build needs. Both of those shipped on 2026-08-04 and broke every deploy for
  # five days before anyone noticed (see 03c4b52). This job actually builds the
  # image so that class of bug fails here instead of at deploy time.
  #
  # Kaniko rather than `docker build`: CI job containers deliberately get no
  # docker socket (docker_host: "-"), no privileges, and run under gVisor. Kaniko
  # builds in userspace and needs none of that, so the sandbox is unchanged.
  # (Rootless buildah was tried first and cannot work here — its user-namespace
  # setup wants /proc/<pid>/setgroups, which gVisor's procfs does not implement.)
  image:
    runs-on: ubuntu-latest
    container:
      image: gcr.io/kaniko-project/executor:debug
    # NOTE: `continue-on-error` was tried here and is useless for this purpose —
    # Forgejo still publishes the job's commit status as failure, so the
    # combined status goes red and REQUIRE_CI blocks the deploy regardless. This
    # job therefore genuinely gates deploys. That is the intent; just know that
    # a flake here stops deploys until the next push.
    steps:
      - name: build the container image
        env:
          # jetstream is private; kaniko clones the context itself (the image has
          # no git or node, so actions/checkout cannot run here).
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # forgejo:3000 is plain HTTP. Kaniko's git context defaults to HTTPS
          # and fails with "server gave HTTP response to HTTPS client".
          GIT_PULL_METHOD: http
        run: |
          /kaniko/executor \
            --context "git://forgejo:3000/${{ github.repository }}.git#${{ github.ref }}" \
            --dockerfile Dockerfile \
            --build-arg COMPANION_URL=http://forgejo:3000/alex/companion.git \
            --no-push \
            --single-snapshot \
            --cleanup
